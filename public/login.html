<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JCT Staff Hub</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230c1738'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='Georgia,serif' font-size='13' font-weight='700' fill='%23b1c9fb'%3EJCT%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy:    #0c1738;
      --navy-mid:#111e40;
      --blue:    #2c5c9c;
      --powder:  #b1c9fb;
      --canvas:  #f0f4f9;
      --surface: #ffffff;
      --border:  rgba(12,23,56,0.08);
      --text:    #0c1738;
      --text-2:  #4a6080;
      --text-3:  #8fa0b8;
    }
    body {
      min-height: 100vh;
      background: var(--canvas);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: 'DM Sans', system-ui, sans-serif;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      width: 100%;
      max-width: 400px;
      padding: 36px 32px;
      box-shadow: 0 4px 32px rgba(12,23,56,0.07);
    }
    .brand { text-align: center; margin-bottom: 32px; }
    .brand-mark {
      width: 52px; height: 52px; border-radius: 14px;
      background: var(--navy); margin: 0 auto 14px;
      display: flex; align-items: center; justify-content: center;
    }
    .brand-name {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.3rem; font-weight: 600; color: var(--text);
    }
    .brand-sub { font-size: 13px; color: var(--text-3); margin-top: 3px; }

    /* Staff grid */
    .staff-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .staff-btn {
      display: flex; align-items: center; gap: 10px;
      background: var(--canvas); border: 1.5px solid var(--border);
      border-radius: 12px; padding: 11px 14px; cursor: pointer;
      transition: all 0.18s; text-align: left; width: 100%;
      font-family: 'DM Sans', sans-serif;
    }
    .staff-btn:hover { border-color: rgba(44,92,156,0.3); background: #eaf0f9; transform: translateY(-1px); }
    .staff-btn.active { border-color: rgba(44,92,156,0.5); background: rgba(44,92,156,0.06); }
    .avatar {
      width: 32px; height: 32px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 12px; flex-shrink: 0; overflow: hidden;
    }
    .staff-name { font-size: 14px; font-weight: 500; color: var(--text); line-height: 1.2; }

    /* Password inline panel */
    .pw-panel {
      margin-top: 16px; padding: 16px; background: var(--canvas);
      border: 1px solid var(--border); border-radius: 14px;
      animation: slideDown 0.18s ease;
    }
    @keyframes slideDown { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:translateY(0); } }
    .pw-who { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .pw-name { font-size: 14px; font-weight: 600; color: var(--text); }
    .pw-change { font-size: 11px; color: var(--text-3); cursor: pointer; margin-left: auto; background: none; border: none; font-family: inherit; padding: 0; }
    .pw-change:hover { color: var(--blue); }
    .pw-input {
      width: 100%; background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 14px; color: var(--text); font-size: 15px;
      outline: none; transition: border-color 0.2s; font-family: 'DM Sans', sans-serif;
      margin-bottom: 10px;
    }
    .pw-input:focus { border-color: rgba(44,92,156,0.4); }
    .pw-input::placeholder { color: var(--text-3); }
    .btn-signin {
      width: 100%; padding: 11px; border-radius: 10px; border: none;
      background: var(--navy); color: #f0f4ff; font-family: 'DM Sans', sans-serif;
      font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.18s;
    }
    .btn-signin:hover { background: var(--blue); }
    .btn-signin:disabled { opacity: 0.5; cursor: not-allowed; }
    .error-msg { font-size: 12px; color: #f87171; text-align: center; margin-bottom: 8px; }
    .default-pw { text-align: center; font-size: 11px; color: var(--text-3); margin-top: 10px; }
    .default-pw span { color: var(--text-2); }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="brand-mark">
        <svg width="28" height="20" viewBox="0 0 54 36" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="15" cy="18" r="13" stroke="rgba(177,201,251,0.5)" stroke-width="1.4"/>
          <text x="15" y="22.5" text-anchor="middle" font-family="'Playfair Display', serif" font-size="11.5" fill="rgba(177,201,251,0.75)" font-weight="500">J</text>
          <circle cx="27" cy="18" r="13" fill="rgba(177,201,251,0.12)" stroke="rgba(177,201,251,0.65)" stroke-width="1.4"/>
          <path d="M20.5 12.5 Q27 15.5 27 18 Q27 20.5 20.5 23.5" stroke="rgba(177,201,251,0.65)" stroke-width="1.1" fill="none" stroke-linecap="round"/>
          <path d="M33.5 12.5 Q27 15.5 27 18 Q27 20.5 33.5 23.5" stroke="rgba(177,201,251,0.65)" stroke-width="1.1" fill="none" stroke-linecap="round"/>
          <circle cx="39" cy="18" r="13" stroke="rgba(177,201,251,0.5)" stroke-width="1.4"/>
          <text x="39" y="22.5" text-anchor="middle" font-family="'Playfair Display', serif" font-size="11.5" fill="rgba(177,201,251,0.75)" font-weight="500">C</text>
        </svg>
      </div>
      <div class="brand-name">Joshua Creek</div>
      <div class="brand-sub">Staff Hub</div>
    </div>

    <div id="staff-grid" class="staff-grid"></div>

    <div id="pw-panel" class="pw-panel" style="display:none">
      <div class="pw-who">
        <div id="pw-avatar" class="avatar"></div>
        <div id="pw-name" class="pw-name"></div>
        <button class="pw-change" onclick="cancelPw()">Change</button>
      </div>
      <p id="error-msg" class="error-msg" style="display:none"></p>
      <input id="pw-input" type="password" class="pw-input" placeholder="Password" autocomplete="current-password" />
      <button class="btn-signin" id="btn-signin" onclick="doLogin()">Sign In</button>
      <div class="default-pw">Default password: <span>jct2025</span></div>
    </div>
  </div>

  <script src="/staff-avatar.js"></script>
  <script>
    let staffList = [];
    let selectedStaff = null;

    async function loadStaff() {
      const res = await fetch('/api/auth/staff');
      staffList = await res.json();
      renderStaff();
    }

    function renderStaff() {
      const grid = document.getElementById('staff-grid');
      grid.innerHTML = '';
      staffList.forEach(s => {
        const btn = document.createElement('button');
        btn.className = 'staff-btn';
        btn.dataset.id = s.id;
        const av = document.createElement('div');
        av.className = 'avatar';
        staffAvatar(av, s.id, s.name, s.color);
        const nameEl = document.createElement('span');
        nameEl.className = 'staff-name';
        nameEl.textContent = s.name;
        btn.appendChild(av);
        btn.appendChild(nameEl);
        btn.onclick = () => selectStaff(s, btn);
        grid.appendChild(btn);
      });
    }

    function selectStaff(s, btn) {
      document.querySelectorAll('.staff-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedStaff = s;
      showPwPanel();
    }

    function showPwPanel() {
      const panel = document.getElementById('pw-panel');
      const av = document.getElementById('pw-avatar');
      staffAvatar(av, selectedStaff.id, selectedStaff.name, selectedStaff.color);
      document.getElementById('pw-name').textContent = selectedStaff.name;
      document.getElementById('pw-input').value = '';
      document.getElementById('error-msg').style.display = 'none';
      panel.style.display = 'block';
      setTimeout(() => document.getElementById('pw-input').focus(), 50);
    }

    function cancelPw() {
      document.querySelectorAll('.staff-btn').forEach(b => b.classList.remove('active'));
      selectedStaff = null;
      document.getElementById('pw-panel').style.display = 'none';
      document.getElementById('pw-input').value = '';
    }

    async function doLogin() {
      if (!selectedStaff) return;
      const password = document.getElementById('pw-input').value;
      const errEl = document.getElementById('error-msg');
      const btn = document.getElementById('btn-signin');
      errEl.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Signing in…';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ staffId: selectedStaff.id, password })
        });
        const data = await res.json();
        if (!res.ok) {
          errEl.textContent = data.error || 'Incorrect password';
          errEl.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Sign In';
          document.getElementById('pw-input').select();
          return;
        }
        window.location.href = '/hub.html';
      } catch (e) {
        errEl.textContent = 'Connection error — try again';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter' && selectedStaff) doLogin();
      if (e.key === 'Escape') cancelPw();
    });

    loadStaff();
  </script>
</body>
</html>
