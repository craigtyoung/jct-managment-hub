<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JCT Staff Hub — Sign In</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    // Apply theme before render to avoid flash
    (function() {
      if (localStorage.getItem('jct-theme') === 'dark') document.documentElement.classList.add('dark-pre');
    })();
  </script>
  <style>
    body {
      --bg:      #f1f5f9;
      --surface: rgba(255,255,255,0.9);
      --border:  rgba(0,0,0,0.08);
      --text:    #0f172a;
      --text2:   #475569;
      --text3:   #94a3b8;
      --input-bg: rgba(255,255,255,0.8);
      --input-border: rgba(0,0,0,0.1);
      --staff-bg: rgba(248,250,252,0.9);
      background: var(--bg); font-family: 'Inter', sans-serif;
    }
    body.dark {
      --bg:      #0f1623;
      --surface: rgba(255,255,255,0.04);
      --border:  rgba(255,255,255,0.07);
      --text:    #f1f5f9;
      --text2:   #94a3b8;
      --text3:   #475569;
      --input-bg: rgba(30,41,59,0.8);
      --input-border: rgba(255,255,255,0.1);
      --staff-bg: rgba(30,41,59,0.8);
    }
    .staff-btn {
      display: flex; align-items: center; gap: 10px;
      background: var(--staff-bg); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px 16px; cursor: pointer;
      transition: all 0.2s ease; color: var(--text); width: 100%; text-align: left;
    }
    .staff-btn:hover { border-color: rgba(16,185,129,0.3); transform: translateY(-1px); }
    .staff-btn.selected { border-color: rgba(16,185,129,0.5); background: rgba(16,185,129,0.08); }
    .avatar { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; flex-shrink: 0; }
    .input-field {
      width: 100%; background: var(--input-bg); border: 1px solid var(--input-border);
      border-radius: 10px; padding: 12px 16px; color: var(--text); font-size: 15px;
      outline: none; transition: border-color 0.2s;
    }
    .input-field:focus { border-color: rgba(16,185,129,0.5); }
    .input-field::placeholder { color: var(--text3); }
    .btn-primary {
      background: #10b981; color: white; font-weight: 600; font-size: 15px;
      padding: 13px; border-radius: 10px; border: none; cursor: pointer; width: 100%;
      transition: all 0.2s ease;
    }
    .btn-primary:hover { background: #059669; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .error-msg { color: #f87171; font-size: 13px; text-align: center; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div style="width: 100%; max-width: 420px;">

    <!-- Logo / Header -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-emerald-500/20 mb-4">
        <svg class="w-7 h-7 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="12" y1="3" x2="12" y2="21"/>
          <line x1="3" y1="7" x2="21" y2="7"/>
          <line x1="3" y1="17" x2="21" y2="17"/>
        </svg>
      </div>
      <h1 class="text-xl font-semibold" style="color:var(--text)">JCT Staff Hub</h1>
      <p class="text-sm mt-1" style="color:var(--text2)">Joshua Creek Tennis</p>
    </div>

    <!-- Step 1: Pick staff member -->
    <div id="step-pick">
      <p class="text-xs font-semibold uppercase tracking-widest mb-3" style="color:var(--text3)">Who are you?</p>
      <div id="staff-grid" class="grid grid-cols-2 gap-2 mb-6"></div>
      <button class="btn-primary" id="btn-next" disabled onclick="goToPassword()">Continue</button>
    </div>

    <!-- Step 2: Password -->
    <div id="step-password" class="hidden">
      <div id="selected-banner" class="flex items-center gap-3 mb-6 p-3 rounded-xl" style="background: rgba(30,41,59,0.6);">
        <div id="banner-avatar" class="avatar"></div>
        <div>
          <div id="banner-name" class="text-sm font-semibold text-white"></div>
          <button onclick="goBack()" class="text-xs text-slate-400 hover:text-slate-200 transition-colors">Change</button>
        </div>
      </div>
      <input id="password-input" type="password" class="input-field mb-3" placeholder="Password" autocomplete="current-password" />
      <p id="error-msg" class="error-msg mb-3 hidden"></p>
      <button class="btn-primary" onclick="doLogin()">Sign In</button>
      <p class="text-center text-xs text-slate-600 mt-4">Default password: <span class="text-slate-400">jct2025</span></p>
    </div>

  </div>

  <script>
    let staffList = [];
    let selectedStaff = null;

    async function loadStaff() {
      const res = await fetch('/api/auth/staff');
      staffList = await res.json();
      renderStaff();
    }

    function renderStaff() {
      const grid = document.getElementById('staff-grid');
      grid.innerHTML = '';
      staffList.forEach(s => {
        const btn = document.createElement('button');
        btn.className = 'staff-btn';
        btn.dataset.id = s.id;
        const initials = s.name.slice(0, 2).toUpperCase();
        btn.innerHTML = `
          <div class="avatar" style="background:${s.color}22; color:${s.color}">${initials}</div>
          <span class="text-sm font-medium">${s.name}</span>
        `;
        btn.onclick = () => selectStaff(s, btn);
        grid.appendChild(btn);
      });
    }

    function selectStaff(s, btn) {
      document.querySelectorAll('.staff-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedStaff = s;
      document.getElementById('btn-next').disabled = false;
    }

    function goToPassword() {
      if (!selectedStaff) return;
      document.getElementById('step-pick').classList.add('hidden');
      document.getElementById('step-password').classList.remove('hidden');
      const initials = selectedStaff.name.slice(0, 2).toUpperCase();
      const avatar = document.getElementById('banner-avatar');
      avatar.textContent = initials;
      avatar.style.background = selectedStaff.color + '22';
      avatar.style.color = selectedStaff.color;
      document.getElementById('banner-name').textContent = selectedStaff.name;
      document.getElementById('password-input').focus();
    }

    function goBack() {
      document.getElementById('step-password').classList.add('hidden');
      document.getElementById('step-pick').classList.remove('hidden');
      document.getElementById('error-msg').classList.add('hidden');
      document.getElementById('password-input').value = '';
    }

    async function doLogin() {
      const password = document.getElementById('password-input').value;
      const errEl = document.getElementById('error-msg');
      errEl.classList.add('hidden');

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ staffId: selectedStaff.id, password })
        });
        const data = await res.json();
        if (!res.ok) {
          errEl.textContent = data.error || 'Login failed';
          errEl.classList.remove('hidden');
          return;
        }
        window.location.href = '/hub.html';
      } catch (e) {
        errEl.textContent = 'Connection error. Try again.';
        errEl.classList.remove('hidden');
      }
    }

    document.getElementById('password-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });

    // Apply persisted theme
    document.body.classList.toggle('dark', localStorage.getItem('jct-theme') === 'dark');

    loadStaff();
  </script>
</body>
</html>
