<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Set your password — JCT Staff Hub</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; font-family: 'Inter', sans-serif; }
    body { background: linear-gradient(160deg, #0c1738 0%, #16264d 55%, #1c3a6b 100%); color: #0c1738; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { width: 100%; max-width: 420px; background: #fff; border-radius: 20px; box-shadow: 0 24px 70px rgba(0,0,0,0.35); overflow: hidden; }
    .card-head { padding: 26px 28px 4px; }
    .card-head h1 { font-family: 'Playfair Display', Georgia, serif; font-size: 22px; margin: 0; color: #0c1738; }
    .card-head p { font-size: 13.5px; color: #4a6080; line-height: 1.55; margin: 8px 0 0; }
    .card-body { padding: 18px 28px 26px; }
    .who { font-size: 13px; color: #4a6080; margin-bottom: 14px; }
    .who strong { color: #0c1738; }
    label { display: block; font-size: 12px; font-weight: 600; color: #4a6080; margin: 12px 0 6px; }
    input { width: 100%; box-sizing: border-box; font-family: inherit; font-size: 15px; color: #0c1738; background: #f8fafc; border: 1px solid rgba(12,23,56,0.14); border-radius: 11px; padding: 11px 13px; outline: none; }
    input:focus { border-color: #2c5c9c; background: #fff; }
    .btn { width: 100%; margin-top: 18px; background: #2c5c9c; color: #fff; border: none; border-radius: 11px; padding: 12px; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; transition: background .15s; }
    .btn:hover { background: #24507f; }
    .btn:disabled { opacity: .6; cursor: default; }
    .msg { font-size: 12.5px; margin-top: 10px; min-height: 16px; }
    .msg.err { color: #dc2626; } .msg.ok { color: #047857; }
    .hint { font-size: 11.5px; color: #8fa0b8; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-head">
      <h1>Create your password</h1>
      <p>Before you get started, set a private password of your own. This replaces the shared default, so only you can sign in to your account.</p>
    </div>
    <div class="card-body">
      <div class="who" id="who"></div>
      <label for="pw1">New password</label>
      <input id="pw1" type="password" autocomplete="new-password" placeholder="At least 4 characters">
      <label for="pw2">Confirm password</label>
      <input id="pw2" type="password" autocomplete="new-password" placeholder="Re-enter it">
      <button class="btn" id="save" onclick="setPassword()">Set password &amp; continue</button>
      <div class="msg" id="msg"></div>
      <div class="hint">Forgot it later? A manager can reset your account.</div>
    </div>
  </div>
  <script>
    fetch('/api/me').then(function (r) { return r.ok ? r.json() : null; }).then(function (me) {
      if (!me) { location.href = '/login.html'; return; }
      if (!me.must_set_password) { location.href = '/hub.html'; return; } // already set
      document.getElementById('who').innerHTML = 'Signed in as <strong>' + (me.real_name || me.name || '') + '</strong>';
      document.getElementById('pw1').focus();
    });
    function setPassword() {
      var p1 = document.getElementById('pw1').value, p2 = document.getElementById('pw2').value;
      var msg = document.getElementById('msg'), btn = document.getElementById('save');
      if (!p1 || p1.length < 4) { msg.className = 'msg err'; msg.textContent = 'Password must be at least 4 characters.'; return; }
      if (p1 !== p2) { msg.className = 'msg err'; msg.textContent = 'Passwords do not match.'; return; }
      btn.disabled = true; btn.textContent = 'Saving…';
      fetch('/api/auth/set-initial-password', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ newPassword: p1 }) })
        .then(function (r) {
          if (r.ok) { msg.className = 'msg ok'; msg.textContent = 'All set — taking you in…'; setTimeout(function () { location.href = '/hub.html'; }, 700); }
          else { r.json().then(function (d) { msg.className = 'msg err'; msg.textContent = (d && d.error) || 'Could not set password.'; }); btn.disabled = false; btn.textContent = 'Set password & continue'; }
        })
        .catch(function () { msg.className = 'msg err'; msg.textContent = 'Connection error — try again.'; btn.disabled = false; btn.textContent = 'Set password & continue'; });
    }
    document.addEventListener('keydown', function (e) { if (e.key === 'Enter') setPassword(); });
  </script>
</body>
</html>
