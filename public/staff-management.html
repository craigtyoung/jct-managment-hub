<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Staff Management — JCT Staff Hub</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; font-family: 'Inter', sans-serif; }
    body {
      --bg:#f7f9fc; --surface:#ffffff; --surface2:#f8fafc; --sidebar-bg:#fbfcfe; --border:rgba(12,23,56,0.08);
      --text:#0c1738; --text2:#4a6080; --text3:#8fa0b8; --navy:#0c1738; --blue:#2c5c9c;
      --input-bg:#f8fafc; --input-border:rgba(12,23,56,0.14);
      background:var(--bg); color:var(--text); display:flex; flex-direction:column;
    }
    h1,h2,h3 { font-family:'Playfair Display',Georgia,serif; }
    a { color:inherit; text-decoration:none; }

    .topbar { background:rgba(255,255,255,0.97); border-bottom:1px solid var(--border); backdrop-filter:blur(20px); flex-shrink:0;
      display:flex; align-items:center; gap:14px; padding:0 20px; height:52px; position:sticky; top:0; z-index:50; }
    .back { display:inline-flex; align-items:center; gap:6px; color:var(--text2); font-size:13px; font-weight:600; padding:6px 10px; border-radius:9px; transition:all .15s; }
    .back:hover { background:rgba(44,92,156,0.08); color:var(--text); }
    .back svg { width:16px; height:16px; }
    .topbar h1 { font-size:18px; margin:0; color:var(--navy); }
    .topbar .sub { font-size:12px; color:var(--text3); font-family:'Inter',sans-serif; margin-left:2px; }

    .shell { display:flex; flex:1; overflow:hidden; }
    .sidebar { width:210px; flex-shrink:0; background:var(--sidebar-bg); border-right:1px solid var(--border); overflow-y:auto; padding:16px 10px; }
    .sidebar-label { font-size:11px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--text3); margin:0 6px 8px; }
    .sidebar-btn { display:flex; align-items:center; gap:9px; width:100%; padding:9px 10px; border-radius:9px; border:none; background:transparent;
      color:var(--text2); font-size:14.5px; cursor:pointer; text-align:left; transition:all .15s; font-family:inherit; }
    .sidebar-btn:hover { background:rgba(44,92,156,0.07); color:var(--text); }
    .sidebar-btn.active { background:rgba(44,92,156,0.1); color:var(--blue); font-weight:600; }
    .sidebar-btn .dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
    .soon { margin-left:auto; font-size:10px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; color:var(--text3); background:var(--surface2); border:1px solid var(--border); border-radius:100px; padding:1px 7px; }

    .main { flex:1; overflow-y:auto; }
    .main-inner { max-width:1000px; margin:0 auto; padding:20px 20px 90px; }
    .panel { display:none; } .panel.active { display:block; }

    .banner { background:linear-gradient(180deg, rgba(44,92,156,0.06), rgba(44,92,156,0.02)); border:1px solid rgba(44,92,156,0.15);
      border-radius:12px; padding:12px 16px; margin-bottom:16px; font-size:13px; color:var(--text2); }
    .banner strong { color:var(--text); }

    .filterbar { display:flex; gap:6px; margin-bottom:14px; }
    .fbtn { padding:7px 14px; border-radius:9px; border:1px solid var(--border); background:var(--surface); color:var(--text2); font-family:inherit; font-size:13px; font-weight:600; cursor:pointer; transition:all .15s; }
    .fbtn:hover { border-color:rgba(44,92,156,0.35); }
    .fbtn.active { background:var(--blue); color:#fff; border-color:var(--blue); }

    .summary { display:flex; gap:20px; flex-wrap:wrap; margin-bottom:16px; }
    .stat { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:11px 16px; min-width:120px; }
    .stat .n { font-size:20px; font-weight:700; color:var(--text); }
    .stat .l { font-size:11px; color:var(--text3); text-transform:uppercase; letter-spacing:.04em; margin-top:1px; }

    .grid-wrap { background:var(--surface); border:1px solid var(--border); border-radius:14px; overflow:hidden; box-shadow:0 1px 3px rgba(12,23,56,0.06); }
    table { width:100%; border-collapse:collapse; }
    thead th { text-align:left; font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--text3);
      padding:11px 12px; border-bottom:1px solid var(--border); background:var(--surface2); white-space:nowrap; }
    thead th.num { text-align:right; }
    tbody td { padding:8px 12px; border-bottom:1px solid var(--border); font-size:14px; vertical-align:middle; }
    tbody tr:last-child td { border-bottom:none; }
    tbody tr:hover { background:var(--surface2); }
    .who { display:flex; align-items:center; gap:10px; }
    .av { width:32px; height:32px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:11px; overflow:hidden; }
    .who .nm { font-weight:600; }
    .role-pill { font-size:11px; font-weight:600; color:var(--text2); background:var(--surface2); border:1px solid var(--border); border-radius:100px; padding:2px 9px; text-transform:capitalize; }
    .type-sel { font-family:inherit; font-size:12.5px; font-weight:600; padding:5px 8px; border-radius:8px; border:1px solid var(--input-border); background:var(--input-bg); color:var(--text2); cursor:pointer; }
    tr.is-salary .rate-in { opacity:0.45; }
    tr.is-salary .type-sel { background:rgba(139,92,246,0.1); color:#7c3aed; border-color:rgba(139,92,246,0.3); }
    .rate-cell { position:relative; }
    .rate-in { width:82px; text-align:right; font-family:inherit; font-size:14px; color:var(--text); background:var(--input-bg);
      border:1px solid var(--input-border); border-radius:8px; padding:6px 8px 6px 18px; outline:none; }
    .rate-in:focus { border-color:var(--blue); background:#fff; }
    .rate-cell .dollar { position:absolute; left:8px; top:50%; transform:translateY(-50%); font-size:12px; color:var(--text3); pointer-events:none; }
    td.num { text-align:right; }
    .pct { font-weight:700; font-size:13px; }
    .pct.up { color:#047857; } .pct.down { color:#dc2626; } .pct.flat { color:var(--text3); }
    .note-in { width:100%; min-width:130px; font-family:inherit; font-size:13px; color:var(--text2); background:transparent; border:1px solid transparent; border-radius:7px; padding:5px 7px; outline:none; }
    .note-in:hover { border-color:var(--border); }
    .note-in:focus { border-color:var(--blue); background:var(--input-bg); color:var(--text); }
    .saved-dot { display:inline-block; width:6px; height:6px; border-radius:50%; background:#10b981; opacity:0; transition:opacity .2s; margin-left:6px; }
    .saved-dot.show { opacity:1; }

    .panel-head-row { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
    .fbtn.add { background:var(--blue); color:#fff; border-color:var(--blue); }
    .jobcell { white-space:nowrap; }
    .jobchk { display:inline-flex; align-items:center; gap:4px; font-size:12.5px; color:var(--text2); cursor:pointer; margin-right:6px; }
    .jobchk input { width:15px; height:15px; accent-color:var(--blue); cursor:pointer; }
    .role-badge { font-size:11px; font-weight:600; border-radius:100px; padding:2px 10px; white-space:nowrap; }
    .role-badge.mgr { background:rgba(44,92,156,0.12); color:#24507f; }
    .role-badge.con { background:rgba(245,158,11,0.16); color:#b45309; }
    .row-act { background:transparent; border:none; cursor:pointer; font-size:14px; padding:4px 6px; border-radius:7px; opacity:0.7; }
    .row-act:hover { opacity:1; background:var(--surface2); }
    .del-act:hover { background:rgba(239,68,68,0.12); }
    .cell-in { width:100%; min-width:80px; font-family:inherit; font-size:13px; color:var(--text); background:transparent; border:1px solid transparent; border-radius:7px; padding:5px 7px; outline:none; }
    .cell-in:hover { border-color:var(--border); }
    .cell-in:focus { border-color:var(--blue); background:var(--input-bg); }
    .cell-in.wide { min-width:160px; }
    .ov { display:none; position:fixed; inset:0; z-index:300; background:rgba(15,23,42,0.55); align-items:flex-start; justify-content:center; padding:40px 16px; overflow-y:auto; }
    .ov.open { display:flex; }
    .modal { width:100%; max-width:460px; background:var(--surface); border-radius:18px; box-shadow:0 20px 60px rgba(0,0,0,0.35); overflow:hidden; }
    .modal-head { display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--border); }
    .modal-head h3 { margin:0; font-size:17px; }
    .modal-x { background:transparent; border:none; color:var(--text3); font-size:20px; cursor:pointer; padding:4px 8px; border-radius:8px; line-height:1; }
    .modal-x:hover { background:var(--surface2); color:var(--text); }
    .modal-body { padding:16px 20px 20px; }
    .modal-body label.lbl { display:block; font-size:12px; font-weight:600; color:var(--text2); margin:8px 0 5px; }
    .modal-body input.fld, .modal-body select.fld { width:100%; box-sizing:border-box; font-family:inherit; font-size:14px; color:var(--text); background:var(--input-bg); border:1px solid var(--input-border); border-radius:10px; padding:9px 12px; outline:none; }
    .row2 { display:flex; gap:10px; } .row2 > div { flex:1; }
    .chk-row { display:flex; align-items:center; gap:8px; margin-top:12px; font-size:14px; color:var(--text2); cursor:pointer; }
    .modal-foot { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }
    .modal-msg { font-size:12.5px; color:#dc2626; margin-top:8px; min-height:16px; }

    .soon-panel { text-align:center; max-width:520px; margin:40px auto; }
    .soon-panel .ico { font-size:42px; }
    .soon-panel h2 { font-size:22px; margin:14px 0 4px; }
    .soon-tag2 { display:inline-block; font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--blue); background:rgba(44,92,156,0.1); border-radius:100px; padding:3px 12px; margin-bottom:12px; }
    .soon-panel p { color:var(--text2); font-size:14px; line-height:1.6; }

    .lock { max-width:440px; margin:80px auto; text-align:center; color:var(--text2); }
    .lock .ico { font-size:40px; } .lock h2 { font-size:20px; margin:12px 0 6px; color:var(--text); }

    @media (max-width:820px){
      .shell { flex-direction:column; }
      .sidebar { width:100%; display:flex; gap:12px; overflow-x:auto; padding:12px; border-right:none; border-bottom:1px solid var(--border); }
      .sidebar-section { flex-shrink:0; }
      .rate-in{ width:72px; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <a href="/hub.html" class="back"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M15 19l-7-7 7-7"/></svg> Hub</a>
    <h1>Staff Management <span class="sub">people portal</span></h1>
  </div>

  <div id="shell"></div>

  <!-- Add staff modal -->
  <div class="ov" id="ov-add" onclick="if(event.target===this)closeAdd()">
    <div class="modal">
      <div class="modal-head"><h3>Add staff member</h3><button class="modal-x" onclick="closeAdd()">&#10005;</button></div>
      <div class="modal-body">
        <div class="row2">
          <div><label class="lbl">First name</label><input class="fld" id="a-first" placeholder="e.g. Kevin"></div>
          <div><label class="lbl">Last name</label><input class="fld" id="a-last"></div>
        </div>
        <label class="lbl">Role</label>
        <select class="fld" id="a-role">
          <option value="staff">Office (front desk)</option>
          <option value="pro">Pro (coach)</option>
          <option value="manager">Manager</option>
          <option value="contractor">Contractor</option>
        </select>
        <label class="chk-row"><input type="checkbox" id="a-pro" style="width:16px;height:16px;accent-color:var(--blue)"> Also a coaching pro</label>
        <label class="lbl">Phone</label><input class="fld" id="a-phone">
        <label class="lbl">Email</label><input class="fld" id="a-email">
        <label class="lbl">Address</label><input class="fld" id="a-address">
        <div class="modal-msg" id="a-msg"></div>
        <div style="font-size:11.5px;color:var(--text3);margin-top:4px">New staff get a default password (jct2026) to change on first sign-in.</div>
        <div class="modal-foot"><button class="fbtn" onclick="closeAdd()">Cancel</button><button class="fbtn add" onclick="saveNewStaff()">Add staff</button></div>
      </div>
    </div>
  </div>

  <input type="file" id="dir-photo-input" accept="image/*" style="display:none" onchange="onPhotoPicked()">

  <script src="/staff-avatar.js"></script>
  <script>
    var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
    function fmtPct(p) { if (p == null) return '<span class="pct flat">—</span>'; var cls = p > 0 ? 'up' : (p < 0 ? 'down' : 'flat'); var sign = p > 0 ? '+' : ''; return '<span class="pct ' + cls + '">' + sign + p + '%</span>'; }

    var ROADMAP = {
      reviews:    { dot:'#f59e0b', label:'Reviews', ico:'⭐', title:'Performance Reviews', desc:'Review dates, ratings, notes and goals, with a full review history per staff member.' },
      employment: { dot:'#0d9488', label:'Employment', ico:'📅', title:'Employment History', desc:'Start date, end date, status (active / on-leave / former), tenure, and an archive of past staff.' },
      documents:  { dot:'#8b5cf6', label:'Documents', ico:'📄', title:'Documents & Certifications', desc:'Contracts, coaching certifications, first-aid and police checks — with expiry reminders.' },
    };

    var allRows = [], filter = 'all', view = 'pay';
    var me = null, canPay = false;

    fetch('/api/me').then(function (r) { return r.ok ? r.json() : null; }).then(function (m) {
      me = m;
      if (!me) { location.href = '/login.html'; return; }
      if (!me.can_manage_staff) {
        document.getElementById('shell').innerHTML =
          '<div class="lock"><div class="ico">🔒</div><h2>Restricted</h2><p>The staff management portal is limited to Craig, Jaime and Victor.</p></div>';
        return;
      }
      canPay = !!me.can_manage_staff; // whole portal is the tight allowlist now
      buildShell();
      view = 'directory'; loadDirectory(); // Directory is the default landing view
    });

    function buildShell() {
      var items = '';
      // Directory sits at the top — it's the primary people portal.
      items += '<button class="sidebar-btn active" data-view="directory" onclick="setView(\'directory\')"><span class="dot" style="background:#0d9488"></span> Directory</button>';
      if (canPay) items += '<button class="sidebar-btn" data-view="pay" onclick="setView(\'pay\')"><span class="dot" style="background:#2c5c9c"></span> Pay Review</button>';
      Object.keys(ROADMAP).forEach(function (k) {
        var r = ROADMAP[k];
        items += '<button class="sidebar-btn" data-view="' + k + '" onclick="setView(\'' + k + '\')"><span class="dot" style="background:' + r.dot + '"></span> ' + esc(r.label) + ' <span class="soon">Soon</span></button>';
      });
      document.getElementById('shell').innerHTML =
        '<div class="shell">' +
          '<div class="sidebar"><div class="sidebar-section"><div class="sidebar-label">Portal</div>' + items + '</div></div>' +
          '<div class="main"><div class="main-inner">' +
            '<div class="panel" id="panel-pay"><div id="paytable"></div></div>' +
            '<div class="panel active" id="panel-directory"></div>' +
            '<div class="panel" id="panel-soon"></div>' +
          '</div></div>' +
        '</div>';
    }

    function setView(v) {
      if (v === 'pay' && !canPay) return;
      view = v;
      document.querySelectorAll('.sidebar-btn').forEach(function (b) { b.classList.toggle('active', b.dataset.view === v); });
      ['pay', 'directory'].forEach(function (p) { var el = document.getElementById('panel-' + p); if (el) el.classList.toggle('active', v === p); });
      var soon = document.getElementById('panel-soon');
      if (v === 'pay') { soon.classList.remove('active'); if (!allRows.length) loadTable(); return; }
      if (v === 'directory') { soon.classList.remove('active'); loadDirectory(); return; }
      var r = ROADMAP[v];
      soon.innerHTML = '<div class="soon-panel"><div class="ico">' + r.ico + '</div><div class="soon-tag2">Coming soon</div><h2>' + esc(r.title) + '</h2><p>' + esc(r.desc) + '</p></div>';
      soon.classList.add('active');
    }

    // ── Directory (add / edit staff) ──
    var dirRows = [];
    var ROLE_LABEL = { staff: 'Office', manager: 'Manager', admin: 'Admin', pro: 'Pro', contractor: 'Contractor' };
    function loadDirectory() { fetch('/api/staff-mgmt/directory').then(function (r) { return r.json(); }).then(function (rows) { dirRows = rows; renderDirectory(); }); }
    function roleOpts(sel) { return ['staff', 'manager', 'admin', 'pro', 'contractor'].map(function (x) { return '<option value="' + x + '"' + (x === sel ? ' selected' : '') + '>' + ROLE_LABEL[x] + '</option>'; }).join(''); }
    function renderDirectory() {
      var html = '<div class="panel-head-row"><div><h2 style="margin:0;font-size:19px">Directory</h2><p style="margin:3px 0 0;font-size:12.5px;color:var(--text3)">First name shows everywhere else in the hub. Last name &amp; contact info live here only.</p></div><button class="fbtn add" onclick="openAddStaff()">+ Add staff</button></div>' +
        '<div class="grid-wrap"><table><thead><tr><th>First</th><th>Last</th><th>Role</th><th>Phone</th><th>Email</th><th>Address</th><th></th></tr></thead><tbody>' +
        dirRows.map(function (r) {
          var roleCell;
          if (r.role === 'manager' || r.role === 'admin') roleCell = '<td><span class="role-badge mgr">Manager</span></td>';
          else if (r.role === 'contractor') roleCell = '<td><span class="role-badge con">Contractor</span></td>';
          else roleCell = '<td class="jobcell">' +
            '<label class="jobchk"><input type="checkbox" id="off-' + r.id + '"' + (r.role === 'staff' ? ' checked' : '') + ' onchange="saveJob(' + r.id + ')"> Office</label> ' +
            '<label class="jobchk"><input type="checkbox" id="pro-' + r.id + '"' + ((r.role === 'pro' || r.is_pro) ? ' checked' : '') + ' onchange="saveJob(' + r.id + ')"> Pro</label></td>';
          return '<tr>' +
            '<td><div class="who"><div class="av" id="dav-' + r.id + '" style="cursor:pointer" title="Change photo" onclick="pickPhoto(' + r.id + ')"></div><input class="cell-in" value="' + esc(r.first_name) + '" onchange="saveStaff(' + r.id + ',\'first_name\',this.value)"></div></td>' +
            '<td><input class="cell-in" value="' + esc(r.last_name) + '" placeholder="—" onchange="saveStaff(' + r.id + ',\'last_name\',this.value)"></td>' +
            roleCell +
            '<td><input class="cell-in" value="' + esc(r.phone) + '" placeholder="—" onchange="saveStaff(' + r.id + ',\'phone\',this.value)"></td>' +
            '<td><input class="cell-in" value="' + esc(r.email) + '" placeholder="—" onchange="saveStaff(' + r.id + ',\'email\',this.value)"></td>' +
            '<td><input class="cell-in wide" value="' + esc(r.address) + '" placeholder="—" onchange="saveStaff(' + r.id + ',\'address\',this.value)"></td>' +
            '<td style="white-space:nowrap">' +
              '<button class="row-act" title="Change photo" onclick="pickPhoto(' + r.id + ')">📷</button>' +
              '<button class="row-act" title="Reset password" onclick="resetPw(' + r.id + ')">🔑</button>' +
              '<button class="row-act del-act" title="Remove staff" onclick="removeStaffRow(' + r.id + ')">🗑</button>' +
            '</td>' +
            '</tr>';
        }).join('') +
        '</tbody></table></div>';
      document.getElementById('panel-directory').innerHTML = html;
      dirRows.forEach(function (r) { var el = document.getElementById('dav-' + r.id); if (el && window.staffAvatar) staffAvatar(el, r.id, r.first_name, r.color); });
    }

    // Directory row actions
    var photoTargetId = null;
    function pickPhoto(id) { photoTargetId = id; document.getElementById('dir-photo-input').click(); }
    function onPhotoPicked() {
      var inp = document.getElementById('dir-photo-input'); var f = inp.files && inp.files[0];
      if (!f || !photoTargetId) return;
      if (f.type.indexOf('image/') !== 0) { alert('Please choose an image.'); inp.value = ''; return; }
      if (f.size > 5 * 1024 * 1024) { alert('Image must be under 5 MB.'); inp.value = ''; return; }
      var fd = new FormData(); fd.append('photo', f);
      fetch('/api/staff/' + photoTargetId + '/photo', { method: 'POST', body: fd }).then(function (r) { inp.value = ''; if (r.ok) loadDirectory(); else alert('Upload failed.'); });
    }
    function resetPw(id) {
      var r = dirRows.find(function (x) { return x.id === id; }); var nm = r ? r.first_name : 'this staff member';
      if (!confirm('Reset ' + nm + "'s password? They'll get a temporary password and must set their own on next login.")) return;
      fetch('/api/staff-mgmt/directory/' + id + '/reset-password', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) { alert(d ? ('Password reset. Temporary password: ' + d.temp + "\nThey'll be prompted to set their own on next sign-in.") : 'Reset failed.'); });
    }
    function removeStaffRow(id) {
      var r = dirRows.find(function (x) { return x.id === id; }); var nm = r ? r.first_name : 'this staff member';
      if (!confirm('Remove ' + nm + ' from the hub? This deletes their account and cannot be undone.')) return;
      fetch('/api/staff-mgmt/directory/' + id, { method: 'DELETE' })
        .then(function (r) { if (r.ok) loadDirectory(); else r.json().then(function (d) { alert((d && d.error) || 'Could not remove.'); }); });
    }
    function saveStaff(id, field, val) {
      var body = {}; body[field] = val;
      fetch('/api/staff-mgmt/directory/' + id, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (row) { if (row) { var i = dirRows.findIndex(function (x) { return x.id === id; }); if (i >= 0) dirRows[i] = row; } });
    }
    // Admin (office) + Pro (coach) checkboxes → derive the stored role + pro flag.
    function saveJob(id) {
      var adm = document.getElementById('off-' + id).checked, pro = document.getElementById('pro-' + id).checked;
      var role, is_pro;
      if (pro && !adm) { role = 'pro'; is_pro = false; }   // coach only
      else { role = 'staff'; is_pro = pro; }                // office, + pro flag if they also coach
      fetch('/api/staff-mgmt/directory/' + id, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ role: role, is_pro: is_pro }) })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (row) { if (row) { var i = dirRows.findIndex(function (x) { return x.id === id; }); if (i >= 0) dirRows[i] = row; } });
    }
    function openAddStaff() { ['a-first', 'a-last', 'a-phone', 'a-email', 'a-address'].forEach(function (i) { document.getElementById(i).value = ''; }); document.getElementById('a-role').value = 'staff'; document.getElementById('a-pro').checked = false; document.getElementById('a-msg').textContent = ''; document.getElementById('ov-add').classList.add('open'); document.body.style.overflow = 'hidden'; }
    function closeAdd() { document.getElementById('ov-add').classList.remove('open'); document.body.style.overflow = ''; }
    function saveNewStaff() {
      var first = document.getElementById('a-first').value.trim(); var msg = document.getElementById('a-msg');
      if (!first) { msg.textContent = 'First name is required.'; return; }
      fetch('/api/staff-mgmt/directory', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({
        first_name: first, last_name: document.getElementById('a-last').value.trim(), role: document.getElementById('a-role').value,
        is_pro: document.getElementById('a-pro').checked, phone: document.getElementById('a-phone').value.trim(),
        email: document.getElementById('a-email').value.trim(), address: document.getElementById('a-address').value.trim()
      }) }).then(function (r) { if (r.ok) { closeAdd(); loadDirectory(); refreshPay(); } else { msg.textContent = 'Could not add staff.'; } });
    }

    // ── Pay Review ──
    function loadTable() { fetch('/api/staff-mgmt').then(function (r) { return r.json(); }).then(function (rows) { allRows = rows; renderPay(); startLiveSync(); }); }

    // Live sync across screens during planning meetings (uses the shared SSE channel).
    var pendingRefresh = false, liveStarted = false;
    function isEditingPay() { var ae = document.activeElement; return !!(ae && ae.closest && ae.closest('#paytable') && (ae.tagName === 'INPUT' || ae.tagName === 'SELECT')); }
    function refreshPay() { fetch('/api/staff-mgmt').then(function (r) { return r.json(); }).then(function (rows) { allRows = rows; if (view === 'pay') renderPay(); }); }
    function startLiveSync() {
      if (liveStarted || typeof EventSource === 'undefined') return; liveStarted = true;
      try {
        var es = new EventSource('/api/events');
        es.onmessage = function (e) {
          if (e.data !== 'staff-pay' && e.data !== 'update') return;
          if (isEditingPay()) { pendingRefresh = true; return; } // don't clobber a cell being edited elsewhere on this screen
          refreshPay();
        };
      } catch (err) {}
      // Apply any deferred refresh once the user finishes editing.
      document.addEventListener('focusout', function () {
        setTimeout(function () { if (pendingRefresh && !isEditingPay()) { pendingRefresh = false; refreshPay(); } }, 200);
      });
    }
    function setFilter(f) { filter = f; renderPay(); }
    // Server already splits dual-role people into one line per job — filter on the track.
    function visibleRows() { return allRows.filter(function (r) { if (filter === 'all') return true; return r.job === filter; }); }
    function patchRow(row) { if (!row) return; var i = allRows.findIndex(function (r) { return r.staff_id === row.staff_id && r.job === row.job; }); if (i >= 0) allRows[i] = row; }
    function payLineLabel(r) { return r.job === 'pro' ? 'Pro' : 'Office'; }
    function payRoleLabel(r) {
      if (r.dual) return payLineLabel(r);
      if (r.role === 'pro') return 'Pro';
      if (r.role === 'manager') return 'Manager';
      if (r.role === 'admin') return 'Admin';
      return 'Office';
    }

    function summary(rows) {
      var withNew = rows.filter(function (r) { return r.new_rate != null; });
      var raises = rows.filter(function (r) { return r.pct_change != null && r.pct_change > 0; }).length;
      var ch = rows.filter(function (r) { return r.pct_change != null; });
      var avg = ch.length ? Math.round((ch.reduce(function (a, r) { return a + r.pct_change; }, 0) / ch.length) * 10) / 10 : null;
      return '<div class="summary">' +
        '<div class="stat"><div class="n">' + rows.length + '</div><div class="l">Rate lines</div></div>' +
        '<div class="stat"><div class="n">' + withNew.length + '</div><div class="l">New rate set</div></div>' +
        '<div class="stat"><div class="n">' + raises + '</div><div class="l">Raises</div></div>' +
        '<div class="stat"><div class="n">' + (avg == null ? '—' : (avg > 0 ? '+' : '') + avg + '%') + '</div><div class="l">Avg change</div></div>' +
        '</div>';
    }

    function renderPay() {
      var rows = visibleRows();
      var fbar = '<div class="filterbar">' +
        [['all', 'All'], ['office', 'Office'], ['pro', 'Pro']].map(function (f) { return '<button class="fbtn' + (filter === f[0] ? ' active' : '') + '" onclick="setFilter(\'' + f[0] + '\')">' + f[1] + '</button>'; }).join('') +
        '</div>';
      var html =
        '<div class="banner">Annual pay review — new rates effective <strong>September 1, 2026</strong>. Staff who work the desk <em>and</em> coach carry a separate Office and Pro rate. Edit a cell to save automatically. Restricted to Craig, Jaime, Victor.</div>' +
        fbar + summary(rows) +
        '<div class="grid-wrap"><table><thead><tr>' +
        '<th>Staff</th><th>Track</th><th>Type</th><th class="num">Current $/hr</th><th class="num">New $/hr (Sep 1)</th><th class="num">Change</th><th>Notes</th>' +
        '</tr></thead><tbody>' +
        rows.map(function (r) {
          var sal = r.pay_type === 'salary';
          var key = r.staff_id + '-' + r.job;
          var nameHtml = esc(r.name) + (r.dual ? ' <span style="color:var(--text3);font-weight:500;font-size:12.5px">· ' + payLineLabel(r) + '</span>' : '');
          return '<tr id="row-' + key + '"' + (sal ? ' class="is-salary"' : '') + '>' +
            '<td><div class="who"><div class="av" id="av-' + key + '"></div><span class="nm">' + nameHtml + '</span></div></td>' +
            '<td><span class="role-pill">' + esc(payRoleLabel(r)) + '</span></td>' +
            '<td><select class="type-sel" onchange="saveType(' + r.staff_id + ',\'' + r.job + '\',this.value)"><option value="hourly"' + (sal ? '' : ' selected') + '>Hourly</option><option value="salary"' + (sal ? ' selected' : '') + '>Salary</option></select></td>' +
            '<td class="num"><div class="rate-cell"><span class="dollar">$</span><input class="rate-in" type="number" step="0.25" min="0" inputmode="decimal" value="' + (r.current_rate != null ? r.current_rate : '') + '" onchange="saveRate(' + r.staff_id + ',\'' + r.job + '\',\'current_rate\',this.value)"></div></td>' +
            '<td class="num"><div class="rate-cell"><span class="dollar">$</span><input class="rate-in" type="number" step="0.25" min="0" inputmode="decimal" value="' + (r.new_rate != null ? r.new_rate : '') + '" onchange="saveRate(' + r.staff_id + ',\'' + r.job + '\',\'new_rate\',this.value)"></div></td>' +
            '<td class="num" id="pct-' + key + '">' + fmtPct(r.pct_change) + '</td>' +
            '<td><input class="note-in" value="' + esc(r.notes) + '" placeholder="add a note" onchange="saveNote(' + r.staff_id + ',\'' + r.job + '\',this.value)"><span class="saved-dot" id="dot-' + key + '"></span></td>' +
            '</tr>';
        }).join('') +
        '</tbody></table></div>';
      document.getElementById('paytable').innerHTML = html;
      rows.forEach(function (r) { var el = document.getElementById('av-' + r.staff_id + '-' + r.job); if (el && window.staffAvatar) staffAvatar(el, r.staff_id, r.name, r.color); });
    }

    function flashSaved(key) { var d = document.getElementById('dot-' + key); if (!d) return; d.classList.add('show'); setTimeout(function () { d.classList.remove('show'); }, 900); }
    function put(id, job, body) { body.job = job; return fetch('/api/staff-mgmt/' + id, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).then(function (r) { return r.ok ? r.json() : null; }); }
    function saveRate(id, job, field, val) { var body = {}; body[field] = val; put(id, job, body).then(function (row) { if (!row) return; patchRow(row); var cell = document.getElementById('pct-' + id + '-' + job); if (cell) cell.innerHTML = fmtPct(row.pct_change); flashSaved(id + '-' + job); }); }
    function saveNote(id, job, val) { put(id, job, { notes: val }).then(function (row) { if (row) { patchRow(row); flashSaved(id + '-' + job); } }); }
    function saveType(id, job, val) { put(id, job, { pay_type: val }).then(function (row) { if (row) { patchRow(row); renderPay(); } }); }
  </script>
</body>
</html>
