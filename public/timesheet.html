<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timesheets · JCT Staff Hub</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --spine-w:0px; --nav-w:214px; --total-nav:calc(var(--spine-w) + var(--nav-w));
      --navy:#0c1738; --navy-mid:#111e40; --navy-hover:rgba(177,201,251,0.07);
      --blue:#2c5c9c; --powder:#b1c9fb;
      --canvas:#f0f4f9; --surface:#ffffff;
      --border:rgba(12,23,56,0.08); --border-nav:rgba(177,201,251,0.07);
      --text:#0c1738; --text-2:#4a6080; --text-3:#8fa0b8;
      --green:#16a34a; --amber:#d97706;
      --font-display:'Playfair Display',Georgia,serif; --font-body: 'Inter', system-ui, sans-serif;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{padding-left:var(--total-nav);background:var(--canvas);color:var(--text);font-family:var(--font-body);font-size:15px;line-height:1.5;min-height:100vh;}

    /* ── Spine ── */
    .spine{position:fixed;left:0;top:0;width:var(--spine-w);height:100vh;background:var(--navy);display:flex;flex-direction:column;align-items:center;z-index:200;border-right:1px solid var(--border-nav);}
    .spine-top{display:flex;flex-direction:column;align-items:center;padding:16px 0 0;}
    .spine-mark{width:44px;height:44px;object-fit:contain;filter:brightness(0) invert(1) opacity(0.55);}
    .spine-divider{width:30px;height:1px;background:var(--border-nav);margin:14px 0 10px;}
    .spine-label{writing-mode:vertical-rl;text-orientation:mixed;transform:rotate(180deg);font-family:var(--font-body);font-size:9px;font-weight:600;letter-spacing:0.20em;text-transform:uppercase;color:rgba(177,201,251,0.30);flex:1;}
    .spine-foot{padding-bottom:18px;display:flex;flex-direction:column;align-items:center;gap:10px;}
    .spine-btn{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;cursor:pointer;color:rgba(177,201,251,0.32);transition:all 0.18s;text-decoration:none;}
    .spine-btn:hover{color:var(--powder);background:var(--navy-hover);}

    /* ── Sidenav ── */
    .sidenav{position:fixed;left:var(--spine-w);top:0;width:var(--nav-w);height:100vh;background:var(--navy-mid);display:flex;flex-direction:column;z-index:190;border-right:1px solid var(--border-nav);overflow-y:auto;}
    .sidenav::-webkit-scrollbar{width:0;}
    .sidenav-brand{padding:20px 18px 16px;border-bottom:1px solid var(--border-nav);flex-shrink:0;}
    .sidenav-brand-name{font-family:var(--font-display);font-size:1rem;font-weight:600;color:#f0f4ff;line-height:1.2;}
    .sidenav-brand-tag{font-size:9.5px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:rgba(177,201,251,0.36);margin-top:4px;}
    .sidenav-body{flex:1;padding:8px 0 4px;}
    .nav-group-label{font-size:9px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:rgba(177,201,251,0.28);padding:14px 18px 5px;}
    .nav-link{display:flex;align-items:center;gap:9px;width:100%;padding:8px 18px 8px 16px;background:none;border:none;cursor:pointer;border-left:2px solid transparent;font-family:var(--font-body);font-size:13px;font-weight:400;color:rgba(177,201,251,0.55);text-align:left;text-decoration:none;transition:color 0.15s,background 0.15s,border-color 0.15s;}
    .nav-link:hover{color:rgba(240,244,255,0.88);background:var(--navy-hover);}
    .nav-link.active{color:var(--powder);border-left-color:var(--powder);background:rgba(177,201,251,0.07);font-weight:500;}
    .nav-icon{width:15px;height:15px;flex-shrink:0;}
    .nav-badge{margin-left:auto;font-size:10px;font-weight:600;background:var(--blue);color:white;padding:1px 7px;border-radius:100px;line-height:1.6;}
    .sidenav-foot{flex-shrink:0;padding:12px 14px 18px;border-top:1px solid var(--border-nav);}
    .sidenav-user{display:flex;align-items:center;gap:9px;padding:6px 4px 10px;}
    .sidenav-avatar{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0;}
    .sidenav-user-name{font-size:12px;font-weight:500;color:rgba(240,244,255,0.85);line-height:1.2;}
    .sidenav-user-role{font-size:10px;color:rgba(177,201,251,0.38);text-transform:capitalize;margin-top:1px;}
    .sidenav-signout{width:100%;padding:7px;background:transparent;border:1px solid rgba(177,201,251,0.12);border-radius:8px;cursor:pointer;font-family:var(--font-body);font-size:11px;color:rgba(177,201,251,0.32);transition:color 0.15s,border-color 0.15s;}
    .sidenav-signout:hover{color:#f87171;border-color:rgba(248,113,113,0.25);}

    /* ── Topstrip ── */
    .topstrip{background:var(--surface);border-bottom:1px solid var(--border);padding:13px 32px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
    .ts-clock{font-size:13px;font-weight:500;color:var(--text);line-height:1;}
    .ts-date{font-size:11px;color:var(--text-3);margin-top:2px;}

    /* ── Main ── */
    .main{max-width:900px;margin:0 auto;padding:32px 32px 80px;}

    /* ── Period nav ── */
    .period-nav{display:flex;align-items:center;gap:12px;margin:24px 0 24px;}
    .period-btn{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;background:var(--surface);border:1px solid var(--border);cursor:pointer;color:var(--text-2);transition:all 0.15s;}
    .period-btn:hover{border-color:rgba(44,92,156,0.25);color:var(--blue);}
    .period-label{font-family:var(--font-display);font-size:1.05rem;font-weight:600;color:var(--text);}
    .period-sub{font-size:11px;color:var(--text-3);margin-left:2px;}
    .today-btn{padding:5px 14px;border-radius:100px;background:none;border:1px solid var(--border);font-family:var(--font-body);font-size:12px;font-weight:500;color:var(--text-2);cursor:pointer;transition:all 0.15s;margin-left:4px;}
    .today-btn:hover{border-color:rgba(44,92,156,0.25);color:var(--blue);}

    /* ── Person cards ── */
    .person-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;overflow:hidden;margin-bottom:16px;}

    .person-head{
      display:flex;align-items:center;justify-content:space-between;
      padding:16px 20px;border-bottom:1px solid var(--border);
      background:var(--canvas);
    }
    .person-head-left{display:flex;align-items:center;gap:10px;}
    .person-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px 4px 8px;border-radius:100px;font-size:13px;font-weight:600;}
    .person-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
    .person-role{font-size:10px;font-weight:600;letter-spacing:0.07em;text-transform:uppercase;color:var(--text-3);}
    .person-head-right{display:flex;align-items:center;gap:14px;}
    .progress-text{font-size:12px;color:var(--text-3);}
    .hours-pill{display:inline-block;padding:3px 10px;border-radius:100px;font-size:12px;font-weight:600;}
    .hours-pill.has{background:rgba(22,163,74,0.08);color:var(--green);}
    .hours-pill.none{color:var(--text-3);font-weight:400;font-size:12px;}

    /* ── Shift rows ── */
    .shift-row{
      display:flex;align-items:center;gap:0;
      padding:11px 20px;border-bottom:1px solid rgba(12,23,56,0.04);
      transition:background 0.12s;
    }
    .shift-row:last-of-type{border-bottom:none;}
    .shift-row:hover{background:rgba(240,244,249,0.6);}

    .shift-cb-wrap{display:flex;align-items:center;flex-shrink:0;margin-right:14px;}
    .shift-cb{
      width:17px;height:17px;border-radius:5px;cursor:pointer;
      accent-color:var(--navy);flex-shrink:0;
    }
    .shift-cb:disabled{cursor:default;opacity:0.5;}

    .shift-row-date{width:96px;font-size:12.5px;color:var(--text-2);flex-shrink:0;}
    .shift-badge{display:inline-block;padding:2px 8px;border-radius:100px;font-size:10px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;flex-shrink:0;}
    .shift-badge.morning{background:rgba(251,191,36,0.12);color:#b45309;}
    .shift-badge.afternoon{background:rgba(44,92,156,0.10);color:var(--blue);}
    .shift-badge.closing{background:rgba(12,23,56,0.07);color:var(--text-2);}

    .shift-sched{font-size:12px;color:var(--text-3);margin:0 14px;flex-shrink:0;min-width:120px;}

    .shift-status-area{flex:1;display:flex;align-items:center;gap:8px;}
    .shift-status-confirmed{font-size:12px;font-weight:600;color:var(--green);}
    .shift-status-override{font-size:12px;font-weight:600;color:var(--blue);}
    .shift-status-pending{font-size:12px;color:var(--text-3);}

    .edit-times-btn{
      font-size:11px;color:var(--text-3);background:none;border:none;cursor:pointer;
      padding:2px 7px;border-radius:6px;transition:color 0.15s,background 0.15s;
      text-decoration:underline;text-underline-offset:2px;
    }
    .edit-times-btn:hover{color:var(--blue);background:rgba(44,92,156,0.06);text-decoration:none;}

    /* ── Override form (inline, below row) ── */
    .override-form{
      display:none;
      padding:10px 20px 12px 51px; /* aligns under the checkbox */
      background:rgba(44,92,156,0.03);
      border-top:1px solid var(--border);
      gap:10px;align-items:center;flex-wrap:wrap;
    }
    .override-form.open{display:flex;}
    .ov-label{font-size:11px;font-weight:600;color:var(--text-3);letter-spacing:0.04em;text-transform:uppercase;width:38px;}
    .time-input{width:86px;padding:5px 8px;border-radius:7px;border:1px solid var(--border);font-family:var(--font-body);font-size:13px;color:var(--text);background:var(--surface);transition:border-color 0.15s;}
    .time-input:focus{outline:none;border-color:rgba(44,92,156,0.35);}
    .sep{font-size:12px;color:var(--text-3);}
    .ov-save-btn{padding:5px 14px;border-radius:100px;background:var(--navy);border:none;font-family:var(--font-body);font-size:12px;color:#f0f4ff;cursor:pointer;font-weight:500;transition:background 0.15s;}
    .ov-save-btn:hover{background:var(--blue);}
    .ov-cancel-btn{padding:5px 10px;border-radius:100px;background:none;border:none;font-family:var(--font-body);font-size:12px;color:var(--text-3);cursor:pointer;transition:color 0.15s;}
    .ov-cancel-btn:hover{color:var(--text-2);}

    /* ── Person card footer (expenses) ── */
    .person-footer{
      padding:12px 20px;border-top:1px solid var(--border);
      display:flex;align-items:center;gap:14px;
      background:rgba(248,250,252,0.6);
    }
    .exp-label{font-size:12px;color:var(--text-2);flex-shrink:0;}
    .exp-input{
      width:96px;padding:5px 9px;border-radius:8px;
      border:1px solid var(--border);font-family:var(--font-body);font-size:13px;
      color:var(--text);background:var(--surface);text-align:right;
      transition:border-color 0.15s;
    }
    .exp-input:focus{outline:none;border-color:rgba(44,92,156,0.35);}
    .exp-saved{font-size:11px;color:var(--green);font-weight:600;display:none;}

    /* ── Defaults panel ── */
    .defaults-panel{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:22px 24px;margin-top:24px;}
    .defaults-title{font-family:var(--font-display);font-size:1rem;font-weight:600;color:var(--text);margin-bottom:4px;}
    .defaults-sub{font-size:12px;color:var(--text-3);margin-bottom:16px;}
    .defaults-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(12,23,56,0.05);}
    .defaults-row:last-child{border-bottom:none;}
    .defaults-label{width:90px;font-size:13px;font-weight:500;color:var(--text);}
    .save-btn{padding:5px 14px;border-radius:100px;background:var(--navy);border:none;font-family:var(--font-body);font-size:12px;color:#f0f4ff;cursor:pointer;font-weight:500;transition:background 0.15s;}
    .save-btn:hover{background:var(--blue);}

    .empty-state{padding:60px 40px;text-align:center;color:var(--text-3);font-size:13px;}

    @media(max-width:768px){.spine,.sidenav{display:none;}body{padding-left:0;}.main{padding:20px 16px 64px;}}

    /* ── Mobile fit (person header + shift rows) ── */
    @media(max-width:820px){
      .main{padding:20px 12px 64px;}
      .topstrip{padding:13px 14px;}

      /* Person-card header: allow the right-side stats to wrap under the name */
      .person-head{flex-wrap:wrap;gap:8px 10px;padding:13px 14px;}
      .person-head-left{flex-wrap:wrap;gap:8px;min-width:0;flex:1 1 auto;}
      .person-chip{max-width:100%;overflow:hidden;text-overflow:ellipsis;}
      .person-head-right{gap:10px;flex:1 1 100%;justify-content:flex-start;padding-left:42px;}

      /* Shift rows: reduce padding, allow wrapping, shrink time labels so nothing clips */
      .shift-row{flex-wrap:wrap;padding:10px 14px;gap:3px 8px;}
      .shift-cb-wrap{margin-right:10px;}
      .shift-row-date{width:auto;min-width:62px;font-size:12px;}
      .shift-sched{min-width:0;margin:0;font-size:11.5px;white-space:nowrap;}
      .shift-status-area{flex:1 1 100%;padding-left:27px;gap:6px;flex-wrap:wrap;}

      /* Keep override form aligned when it wraps */
      .override-form{padding-left:27px;}
    }
  </style>
</head>
<body>
  <style>.spine{display:none!important}.sidenav{background:#fff;border-right:1px solid rgba(12,23,56,0.08)}.sidenav-brand{border-bottom:1px solid rgba(12,23,56,0.08)}.sidenav-brand-name{color:#0c1738}.sidenav-brand-tag{color:#8fa0b8}.nav-group-label{color:#8fa0b8}.nav-link{color:#4a6080}.nav-link:hover{color:#0c1738;background:#eef2f8}.nav-link.active{color:#2c5c9c;border-left-color:#2c5c9c;background:rgba(44,92,156,0.10)}.nav-badge{background:#2c5c9c;color:#fff}.sidenav-user-name{color:#0c1738}.sidenav-user-role{color:#8fa0b8}.sidenav-signout{border:1px solid rgba(12,23,56,0.08);color:#8fa0b8}.sidenav-signout:hover{color:#dc2626;border-color:rgba(220,38,38,0.3)}body{background:#f7f9fc}:root{--nav-w:0px}body{padding-left:0}.main{max-width:none!important;margin:0!important}.topstrip{flex-wrap:wrap;gap:10px}.qnav{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:9px;text-decoration:none;color:#4a6080;font-size:13px;font-weight:600;border:1px solid transparent;transition:all .15s;cursor:pointer}.qnav svg{width:16px;height:16px}.qnav:hover{background:#eef2f8;color:#0c1738}.qnav.qnav-active{background:rgba(44,92,156,0.10);color:#2c5c9c}@media(max-width:820px){.qnav span{display:none}}.ts-user{display:flex;align-items:center;gap:8px;padding-left:8px;border-left:1px solid rgba(12,23,56,0.08)}.ts-signout{width:auto;padding:6px 11px;background:transparent;border:1px solid rgba(12,23,56,0.08);border-radius:8px;color:#8fa0b8;font-family:Inter,sans-serif;font-size:11px;font-weight:600;cursor:pointer}.ts-signout:hover{color:#dc2626;border-color:rgba(220,38,38,0.3)}</style>

  <!-- Spine -->
  <div class="spine">
    <div class="spine-top">
      <img src="/jct-logo.png" class="spine-mark" alt="JCT" />
      <div class="spine-divider"></div>
      <div class="spine-label">Staff Hub</div>
    </div>
    <div class="spine-foot">
      <a href="/hub.html" class="spine-btn" title="Dashboard">
        <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.2"/><rect x="14" y="3" width="7" height="7" rx="1.2"/><rect x="3" y="14" width="7" height="7" rx="1.2"/><rect x="14" y="14" width="7" height="7" rx="1.2"/></svg>
      </a>
    </div>
  </div>

  <!-- Sidenav -->

  <!-- Top Strip -->
  <div class="topstrip">
    <div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap">
      <a href="/hub.html" class="qnav" title="Dashboard"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.9"><rect x="3" y="3" width="7" height="7" rx="1.2"/><rect x="14" y="3" width="7" height="7" rx="1.2"/><rect x="3" y="14" width="7" height="7" rx="1.2"/><rect x="14" y="14" width="7" height="7" rx="1.2"/></svg><span>Dashboard</span></a>
      <a href="/checklist.html" class="qnav" title="Shift Checklist"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.9"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg><span>Checklist</span></a>
      <a href="/cash-summary.html" class="qnav" title="Cash Summary"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.9"><rect x="2" y="6" width="20" height="13" rx="2"/><circle cx="12" cy="12" r="3"/></svg><span>Cash</span></a>
      <a href="/schedule.html" class="qnav" title="Schedule"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.9"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><span>Schedule</span></a>
      <span class="qnav qnav-active" title="Timesheets"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span>Time</span></span>
      <a href="/comms.html" class="qnav" title="Communications"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.9"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>Comms</span></a>
    </div>
    <div class="ts-right" style="display:flex;align-items:center;gap:10px">
      <div style="text-align:right"><div class="ts-clock" id="clock">—</div><div class="ts-date" id="dateline">—</div></div>
      <div class="ts-user"><div class="sidenav-avatar" id="nav-avatar" style="width:28px;height:28px;border-radius:50%;overflow:hidden"></div><button class="ts-signout" onclick="doLogout()">Sign out</button></div>
    </div>
  </div>

  <!-- Main -->
  <main class="main">
    <h1 style="font-family:var(--font-display);font-size:1.8rem;font-weight:600;color:var(--text);margin-bottom:4px">Timesheets</h1>
    <p style="font-size:13px;color:var(--text-2);margin-bottom:0" id="page-hint"></p>

    <!-- Period Nav -->
    <div class="period-nav">
      <button class="period-btn" onclick="prevPeriod()">
        <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div>
        <span class="period-label" id="period-label">—</span>
        <span class="period-sub" id="period-sub"></span>
      </div>
      <button class="period-btn" onclick="nextPeriod()">
        <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><path d="M9 18l6-6-6-6"/></svg>
      </button>
      <button class="today-btn" onclick="goToday()">Current period</button>
    </div>

    <!-- Person cards -->
    <div id="ts-main">
      <div class="empty-state">Loading…</div>
    </div>

    <!-- Shift defaults (admin only) -->
    <div class="defaults-panel" id="defaults-panel" style="display:none">
      <div class="defaults-title">Default Shift Times</div>
      <div class="defaults-sub">These pre-fill the scheduled times shown on each shift row.</div>
      <div id="defaults-rows"></div>
    </div>
  </main>

  <script>
    const SHIFTS       = ['morning','afternoon','closing'];
    const SHIFT_LABELS = { morning:'Morning', afternoon:'Afternoon', closing:'Closing' };
    const SHIFT_ORDER  = { morning:0, afternoon:1, closing:2 };
    const DAY_FULL     = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const DAY_SHORT    = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const MONTHS       = ['January','February','March','April','May','June','July','August','September','October','November','December'];

    let me = null;
    let isAdmin = false;    // admin or manager — can edit any row, see all staff, add expenses
    let canConfirm = false; // all logged-in users — can confirm their own shifts
    let currentStart = '', currentEnd = '';
    let weekRows = [], weekDefaults = {}, periodExpenses = {};

    // ── Clock ──────────────────────────────────────────────────────
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString('en-CA',{hour:'2-digit',minute:'2-digit',hour12:true});
      document.getElementById('dateline').textContent = now.toLocaleDateString('en-CA',{weekday:'long',month:'long',day:'numeric'});
    }
    updateClock(); setInterval(updateClock, 1000);

    function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    function fmt12(t) {
      if (!t) return '—';
      const [h, m] = t.split(':').map(Number);
      const ampm = h >= 12 ? 'pm' : 'am';
      return `${h % 12 || 12}:${String(m).padStart(2,'0')} ${ampm}`;
    }

    function calcHours(start, end) {
      if (!start || !end) return null;
      const [sh, sm] = start.split(':').map(Number);
      const [eh, em] = end.split(':').map(Number);
      const mins = (eh * 60 + em) - (sh * 60 + sm);
      return mins > 0 ? mins / 60 : null;
    }

    function fmtHours(h) {
      if (h === null || h === undefined || isNaN(h)) return '—';
      const hrs = Math.floor(h), mins = Math.round((h - hrs) * 60);
      return mins > 0 ? `${hrs}h ${mins}m` : `${hrs}h`;
    }

    // ── Period helpers ─────────────────────────────────────────────
    function todayStr() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function computePeriod(dateStr) {
      const d = new Date(dateStr + 'T12:00:00');
      const yr = d.getFullYear(), mo = String(d.getMonth()+1).padStart(2,'0'), day = d.getDate();
      if (day <= 15) return { start: `${yr}-${mo}-01`, end: `${yr}-${mo}-15` };
      const last = new Date(yr, d.getMonth()+1, 0).getDate();
      return { start: `${yr}-${mo}-16`, end: `${yr}-${mo}-${last}` };
    }

    function shiftPeriod(startStr, dir) {
      const d = new Date(startStr + 'T12:00:00');
      if (dir === -1) { d.getDate() === 1 ? d.setDate(0) : d.setDate(1); }
      else { d.getDate() === 1 ? d.setDate(16) : (d.setDate(d.getDate() + 16), d.setDate(1)); }
      return computePeriod(d.toISOString().slice(0,10));
    }

    function fmtPeriodLabel(start, end) {
      const s = new Date(start + 'T12:00:00'), e = new Date(end + 'T12:00:00');
      return `${MONTHS[s.getMonth()]} ${s.getDate()}–${e.getDate()}, ${s.getFullYear()}`;
    }

    // ── Nav ────────────────────────────────────────────────────────
    function prevPeriod() { const p = shiftPeriod(currentStart,-1); currentStart=p.start; currentEnd=p.end; load(); }
    function nextPeriod() { const p = shiftPeriod(currentStart, 1); currentStart=p.start; currentEnd=p.end; load(); }
    function goToday()    { const p = computePeriod(todayStr()); currentStart=p.start; currentEnd=p.end; load(); }

    // ── Load ───────────────────────────────────────────────────────
    async function load() {
      document.getElementById('period-label').textContent = fmtPeriodLabel(currentStart, currentEnd);
      document.getElementById('period-sub').textContent   = `(${currentStart} to ${currentEnd})`;
      document.getElementById('ts-main').innerHTML = '<div class="empty-state">Loading…</div>';
      try {
        const res  = await fetch(`/api/timesheet/week?start=${currentStart}&end=${currentEnd}`);
        const data = await res.json();
        weekRows     = data.rows     || [];
        weekDefaults = data.defaults || {};
        periodExpenses = data.period_expenses || {};
        render();
        if (isAdmin) renderDefaults();
      } catch(e) {
        document.getElementById('ts-main').innerHTML = '<div class="empty-state">Failed to load timesheets.</div>';
      }
    }

    // ── Render ─────────────────────────────────────────────────────
    function render() {
      if (!weekRows.length) {
        document.getElementById('ts-main').innerHTML =
          '<div class="empty-state">No shifts scheduled this period.<br>Assign staff on the <a href="/schedule.html" style="color:var(--blue)">Schedule</a> page first.</div>';
        return;
      }

      // Group by staff
      const groups = {};
      for (const row of weekRows) {
        if (!groups[row.staff_id]) {
          groups[row.staff_id] = { id: row.staff_id, name: row.staff_name, color: row.staff_color, role: row.staff_role, rows: [] };
        }
        groups[row.staff_id].rows.push(row);
      }

      // Sort each person's shifts by date then shift order
      for (const g of Object.values(groups)) {
        g.rows.sort((a, b) => a.date.localeCompare(b.date) || (SHIFT_ORDER[a.shift]||0) - (SHIFT_ORDER[b.shift]||0));
      }

      // Determine which staff to show
      const staffIds = Object.keys(groups)
        .map(Number)
        .sort((a, b) => groups[a].name.localeCompare(groups[b].name));
      const visible = isAdmin ? staffIds : staffIds.filter(id => id === me.id);

      if (!visible.length) {
        document.getElementById('ts-main').innerHTML = '<div class="empty-state">No shifts found for this period.</div>';
        return;
      }

      document.getElementById('ts-main').innerHTML = visible.map(sid => renderPersonCard(groups[sid])).join('');

      // Load staff photos after render
      visible.forEach(sid => staffAvatar(document.getElementById(`ts-av-${sid}`), sid, groups[sid].name, groups[sid].color));
    }

    function renderPersonCard(person) {
      const totalHours = person.rows.reduce((sum, r) => {
        return sum + (calcHours(r.actual_start, r.actual_end) || 0);
      }, 0);
      const confirmed = person.rows.filter(r => r.actual_start).length;
      const total     = person.rows.length;
      const expenses  = periodExpenses[person.id] ?? null;

      const hoursPill = totalHours > 0
        ? `<span class="hours-pill has">${fmtHours(totalHours)}</span>`
        : `<span class="hours-pill none">No hours logged</span>`;

      const shiftRowsHtml = person.rows.map(r => renderShiftRow(r, person)).join('');

      const expensesRow = isAdmin ? `
        <div class="person-footer">
          <span class="exp-label">Expenses this period</span>
          <input type="number" class="exp-input" id="exp-${person.id}"
            value="${expenses !== null ? expenses : ''}"
            min="0" step="0.01" placeholder="$0.00"
            onblur="saveExpenses(${person.id})"
            onkeydown="if(event.key==='Enter')this.blur()">
          <span class="exp-saved" id="exp-saved-${person.id}">Saved ✓</span>
          ${expenses !== null && expenses > 0 ? `<span style="font-size:12px;color:var(--amber);font-weight:600">$${parseFloat(expenses).toFixed(2)}</span>` : ''}
        </div>` : '';

      return `
        <div class="person-card">
          <div class="person-head">
            <div class="person-head-left">
              <div id="ts-av-${person.id}" style="width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;overflow:hidden;background:${person.color}22;color:${person.color}">
                ${esc(person.name).slice(0,2).toUpperCase()}
              </div>
              <span class="person-chip" style="background:${person.color}18;color:${person.color}">
                ${esc(person.name)}
              </span>
              <span class="person-role">${person.role}</span>
            </div>
            <div class="person-head-right">
              <span class="progress-text">${confirmed}/${total} shifts</span>
              ${hoursPill}
            </div>
          </div>
          ${shiftRowsHtml}
          ${expensesRow}
        </div>`;
    }

    function renderShiftRow(row, person) {
      const key = `${row.staff_id}-${row.date}-${row.shift}`;
      const isConfirmed = !!row.actual_start;
      const isOverride  = isConfirmed && (
        row.actual_start !== row.scheduled_start ||
        row.actual_end   !== row.scheduled_end
      );

      const dt = new Date(row.date + 'T12:00:00');
      const dateLabel = `${DAY_SHORT[dt.getDay()]} ${MONTHS[dt.getMonth()].slice(0,3)} ${dt.getDate()}`;

      const canConfirmThisRow = isAdmin || (row.staff_id === me.id);

      let statusHtml = '';
      if (isOverride) {
        statusHtml = `<span class="shift-status-override">${fmt12(row.actual_start)} – ${fmt12(row.actual_end)}</span>`;
      } else if (isConfirmed) {
        statusHtml = `<span class="shift-status-confirmed">Confirmed ✓</span>`;
      } else {
        statusHtml = `<span class="shift-status-pending">Not confirmed</span>`;
      }

      const editBtn = isAdmin && isConfirmed
        ? `<button class="edit-times-btn" onclick="openOverride('${key}')">Edit times</button>`
        : '';

      const overrideForm = isAdmin ? `
        <div class="override-form" id="override-${key}">
          <span class="ov-label">Start</span>
          <input type="time" class="time-input" id="ov-start-${key}" value="${row.actual_start || row.scheduled_start || ''}">
          <span class="sep">–</span>
          <span class="ov-label" style="width:30px">End</span>
          <input type="time" class="time-input" id="ov-end-${key}" value="${row.actual_end || row.scheduled_end || ''}">
          <button class="ov-save-btn" onclick="saveOverride('${key}', ${row.staff_id}, '${row.date}', '${row.shift}')">Save</button>
          <button class="ov-cancel-btn" onclick="closeOverride('${key}')">Cancel</button>
        </div>` : '';

      // Store row data for JS access
      window._rowData = window._rowData || {};
      window._rowData[key] = row;

      return `
        <div class="shift-row" id="row-${key}">
          <div class="shift-cb-wrap">
            <input type="checkbox" class="shift-cb"
              id="cb-${key}"
              ${isConfirmed ? 'checked' : ''}
              ${!canConfirmThisRow ? 'disabled' : ''}
              onchange="toggleShift('${key}', ${row.staff_id}, '${row.date}', '${row.shift}', '${row.scheduled_start || ''}', '${row.scheduled_end || ''}')">
          </div>
          <span class="shift-row-date">${dateLabel}</span>
          <span class="shift-badge ${row.shift}">${SHIFT_LABELS[row.shift]}</span>
          <span class="shift-sched">${fmt12(row.scheduled_start)} – ${fmt12(row.scheduled_end)}</span>
          <div class="shift-status-area">
            ${statusHtml}
            ${editBtn}
          </div>
        </div>
        ${overrideForm}`;
    }

    // ── Toggle shift confirmation ──────────────────────────────────
    async function toggleShift(key, staffId, date, shift, scheduledStart, scheduledEnd) {
      const cb = document.getElementById(`cb-${key}`);
      const isChecked = cb.checked;

      cb.disabled = true;
      try {
        await fetch('/api/timesheet/entry', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            staff_id:     staffId,
            date,
            shift,
            actual_start: isChecked ? (scheduledStart || null) : null,
            actual_end:   isChecked ? (scheduledEnd   || null) : null,
          }),
        });
        // Update local row data
        if (window._rowData && window._rowData[key]) {
          window._rowData[key].actual_start = isChecked ? scheduledStart : null;
          window._rowData[key].actual_end   = isChecked ? scheduledEnd   : null;
        }
        // Re-render just this person's card by reloading
        await load();
      } catch(e) {
        cb.checked = !isChecked; // revert
        cb.disabled = false;
      }
    }

    // ── Override (edit times) ──────────────────────────────────────
    function openOverride(key) {
      document.getElementById(`override-${key}`)?.classList.add('open');
    }
    function closeOverride(key) {
      document.getElementById(`override-${key}`)?.classList.remove('open');
    }

    async function saveOverride(key, staffId, date, shift) {
      const start = document.getElementById(`ov-start-${key}`)?.value;
      const end   = document.getElementById(`ov-end-${key}`)?.value;
      if (!start || !end) { alert('Enter both start and end times.'); return; }
      try {
        await fetch('/api/timesheet/entry', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ staff_id: staffId, date, shift, actual_start: start, actual_end: end }),
        });
        await load();
      } catch(e) { alert('Failed to save.'); }
    }

    // ── Expenses per person per period ────────────────────────────
    async function saveExpenses(staffId) {
      const input = document.getElementById(`exp-${staffId}`);
      const saved = document.getElementById(`exp-saved-${staffId}`);
      if (!input) return;
      const amount = input.value !== '' ? parseFloat(input.value) : null;
      try {
        await fetch('/api/timesheet/period-expenses', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ staff_id: staffId, period_start: currentStart, amount }),
        });
        periodExpenses[staffId] = amount;
        if (saved) { saved.style.display = 'inline'; setTimeout(() => saved.style.display = 'none', 2000); }
      } catch(e) { alert('Failed to save expenses.'); }
    }

    // ── Defaults (admin only) ──────────────────────────────────────
    function renderDefaults() {
      document.getElementById('defaults-panel').style.display = 'block';
      document.getElementById('defaults-rows').innerHTML = SHIFTS.map(shift => {
        const d = weekDefaults[shift] || {};
        return `<div class="defaults-row">
          <span class="defaults-label">${SHIFT_LABELS[shift]}</span>
          <input type="time" id="def-start-${shift}" class="time-input" value="${d.start||''}" style="width:82px">
          <span style="font-size:12px;color:var(--text-3)">–</span>
          <input type="time" id="def-end-${shift}"   class="time-input" value="${d.end||''}"   style="width:82px">
          <button class="save-btn" onclick="saveDefault('${shift}')" style="margin-left:8px">Update</button>
        </div>`;
      }).join('');
    }

    async function saveDefault(shift) {
      const start = document.getElementById(`def-start-${shift}`)?.value;
      const end   = document.getElementById(`def-end-${shift}`)?.value;
      if (!start || !end) { alert('Enter both start and end times.'); return; }
      await fetch(`/api/timesheet/defaults/${shift}`, { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({start,end}) });
      weekDefaults[shift] = {start,end};
    }

    // ── Logout ─────────────────────────────────────────────────────
    async function doLogout() { await fetch('/api/auth/logout',{method:'POST'}); window.location.href='/login.html'; }

    // ── Init ───────────────────────────────────────────────────────
    async function init() {
      const res = await fetch('/api/me');
      if (res.status === 401) { window.location.href = '/login.html'; return; }
      me = await res.json();

      const av = document.getElementById('nav-avatar');
      staffAvatar(av, me.id, me.name, me.color);
      const _nn=document.getElementById('nav-name'); if(_nn)_nn.textContent=me.name;
      const _nr=document.getElementById('nav-role'); if(_nr)_nr.textContent=me.role;
      const _ang=document.getElementById('admin-nav-group'); if(me.role==='admin'&&_ang)_ang.style.display='block';

      isAdmin  = ['admin','manager'].includes(me.role);
      canConfirm = true; // everyone can confirm their own

      document.getElementById('page-hint').textContent = isAdmin
        ? 'Semi-monthly periods · Check a shift to confirm hours worked. Edit times only if different from scheduled. Expenses are per person per period.'
        : 'Check off your shifts to confirm you worked as scheduled. Your manager handles time adjustments and expenses.';

      try {
        const ur = await fetch('/api/messages/unread-count');
        const { count } = await ur.json();
        if (count > 0) { const nb = document.getElementById('comms-nav-badge'); nb.textContent=count; nb.style.display='inline-block'; }
      } catch(e) {}

      const period = computePeriod(todayStr());
      currentStart = period.start;
      currentEnd   = period.end;
      load();
    }

    init();
  </script>
  <script src="/staff-avatar.js"></script>
  <script src="/chat-widget.js"></script>
</body>
</html>
