<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — JCT Staff Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body {
      --bg:        #f1f5f9;
      --surface:   #ffffff;
      --topbar:    rgba(255,255,255,0.97);
      --border:    rgba(0,0,0,0.07);
      --card-bg:   #ffffff;
      --card-border: rgba(0,0,0,0.07);
      --input-bg:  #f8fafc;
      --input-border: rgba(0,0,0,0.1);
      --text:      #0f172a;
      --text2:     #475569;
      --text3:     #94a3b8;
      background: var(--bg); color: var(--text);
      font-family: 'Inter', sans-serif;
    }
    body.dark {
      --bg:        #0f1623;
      --surface:   #1a2540;
      --topbar:    rgba(15,22,35,0.98);
      --border:    rgba(255,255,255,0.05);
      --card-bg:   rgba(26,37,64,0.7);
      --card-border: rgba(255,255,255,0.06);
      --input-bg:  rgba(30,41,59,0.8);
      --input-border: rgba(255,255,255,0.1);
      --text:      #f1f5f9;
      --text2:     #94a3b8;
      --text3:     #475569;
    }
    .topbar { background: var(--topbar); border-bottom: 1px solid var(--border); backdrop-filter: blur(20px); }
    .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; }
    .input-field {
      width: 100%; background: var(--input-bg); border: 1px solid var(--input-border);
      border-radius: 10px; padding: 10px 14px; color: var(--text); font-size: 14px;
      outline: none; transition: border-color 0.2s; font-family: 'Inter', sans-serif;
    }
    .input-field:focus { border-color: rgba(99,102,241,0.5); }
    .input-field::placeholder { color: var(--text3); }
    .select-field {
      background: var(--input-bg); border: 1px solid var(--input-border);
      border-radius: 10px; padding: 10px 14px; color: var(--text); font-size: 14px;
      outline: none; cursor: pointer; font-family: 'Inter', sans-serif;
    }
    .btn { border-radius: 9px; font-size: 14px; font-weight: 600; padding: 9px 18px; cursor: pointer; border: none; transition: all 0.18s; font-family: 'Inter', sans-serif; }
    .btn-indigo { background: #6366f1; color: white; }
    .btn-indigo:hover { background: #4f46e5; }
    .btn-sm { font-size: 12px; padding: 6px 12px; }
    .btn-ghost { background: transparent; border: 1px solid rgba(255,255,255,0.1); color: #94a3b8; }
    .btn-ghost:hover { border-color: rgba(255,255,255,0.2); color: white; }
    .btn-danger { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.2); color: #f87171; }
    .btn-danger:hover { background: rgba(239,68,68,0.25); }
    .btn-amber { background: rgba(245,158,11,0.15); border: 1px solid rgba(245,158,11,0.2); color: #fbbf24; }
    .btn-amber:hover { background: rgba(245,158,11,0.25); }
    .role-badge {
      font-size: 10px; font-weight: 700; letter-spacing: 0.06em;
      padding: 3px 8px; border-radius: 100px; text-transform: uppercase;
    }
    .role-admin   { background: rgba(99,102,241,0.15); color: #818cf8; border: 1px solid rgba(99,102,241,0.2); }
    .role-manager { background: rgba(245,158,11,0.15); color: #fbbf24; border: 1px solid rgba(245,158,11,0.2); }
    .role-staff   { background: rgba(100,116,139,0.15); color: #94a3b8; border: 1px solid rgba(100,116,139,0.2); }
    .avatar { width: 36px; height: 36px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex-shrink: 0; }
    .color-swatch { width: 26px; height: 26px; border-radius: 7px; cursor: pointer; border: 2px solid transparent; transition: all 0.15s; flex-shrink: 0; }
    .color-swatch.selected { border-color: white; transform: scale(1.15); }
    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .modal { background: var(--surface); border: 1px solid var(--card-border); border-radius: 20px; width: 100%; max-width: 440px; padding: 28px; }
    .toast { position: fixed; bottom: 24px; right: 24px; z-index: 200; background: var(--surface); border: 1px solid var(--card-border); border-radius: 12px; padding: 12px 20px; color: var(--text); font-size: 14px; font-weight: 500; opacity: 0; transform: translateY(8px); transition: all 0.25s; pointer-events: none; }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.success { border-color: rgba(16,185,129,0.3); }
    .toast.error   { border-color: rgba(239,68,68,0.3); color: #f87171; }
  </style>
</head>
<body class="min-h-screen text-white antialiased">

  <!-- Top Bar -->
  <div class="topbar sticky top-0 z-50 flex items-center justify-between px-6 py-3.5">
    <div class="flex items-center gap-3">
      <a href="/hub.html" class="flex items-center gap-2 text-slate-400 hover:text-white transition-colors text-sm">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        Hub
      </a>
      <div class="h-4 w-px bg-white/10"></div>
      <span class="text-sm font-semibold" style="color:var(--text)">Admin Panel</span>
    </div>
    <div class="flex items-center gap-2">
      <div id="me-badge" class="flex items-center gap-2 bg-slate-800/60 rounded-xl px-3 py-1.5 border border-white/5">
        <div id="me-avatar" class="h-6 w-6 rounded-lg flex items-center justify-center font-semibold text-xs"></div>
        <span id="me-name" class="text-xs font-medium text-slate-200"></span>
      </div>
    </div>
  </div>

  <main class="max-w-4xl mx-auto px-6 py-8">

    <div class="mb-8">
      <h1 class="text-xl font-semibold" style="color:var(--text)">Staff Management</h1>
      <p class="text-sm mt-1" style="color:var(--text2)">Add, edit, or remove staff members. Reset passwords. Clear daily data.</p>
    </div>

    <!-- Staff List -->
    <div class="card mb-6">
      <div class="flex items-center justify-between px-6 py-4 border-b border-white/5">
        <div>
          <h2 class="text-sm font-semibold text-white">Staff Members</h2>
          <p class="text-xs text-slate-500 mt-0.5" id="staff-count">Loading...</p>
        </div>
        <button class="btn btn-indigo btn-sm" onclick="openAddModal()">
          <span class="flex items-center gap-1.5">
            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
            Add Staff
          </span>
        </button>
      </div>
      <div id="staff-list" class="divide-y divide-white/5">
        <div class="px-6 py-8 text-center text-slate-500 text-sm">Loading staff...</div>
      </div>
    </div>

    <!-- Danger Zone -->
    <div class="card border border-red-500/10">
      <div class="px-6 py-4 border-b border-white/5">
        <h2 class="text-sm font-semibold text-white">Data Control</h2>
        <p class="text-xs text-slate-500 mt-0.5">Clear messages for a specific date. Use during testing or daily resets.</p>
      </div>
      <div class="px-6 py-5 flex items-end gap-4 flex-wrap">
        <div>
          <label class="text-xs font-medium text-slate-400 block mb-1.5">Clear day</label>
          <input type="date" id="clear-date" class="input-field" style="width: auto;" />
        </div>
        <button class="btn btn-danger btn-sm" onclick="clearDay()">Clear messages</button>
      </div>
    </div>

  </main>

  <!-- Add/Edit Staff Modal -->
  <div id="staff-modal" class="modal-overlay hidden" onclick="closeModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <h3 id="modal-title" class="text-base font-semibold text-white mb-5">Add Staff Member</h3>

      <div class="space-y-4">
        <div>
          <label class="text-xs font-medium text-slate-400 block mb-1.5">Name</label>
          <input id="modal-name" type="text" class="input-field" placeholder="e.g. Sarah" autocomplete="off" />
        </div>

        <div>
          <label class="text-xs font-medium text-slate-400 block mb-2">Colour</label>
          <div id="color-picker" class="flex flex-wrap gap-2"></div>
        </div>

        <div>
          <label class="text-xs font-medium text-slate-400 block mb-1.5">Role</label>
          <select id="modal-role" class="select-field w-full">
            <option value="staff">Staff</option>
            <option value="manager">Manager</option>
            <option value="admin">Admin</option>
          </select>
        </div>

        <div id="password-section">
          <label class="text-xs font-medium text-slate-400 block mb-1.5">Password <span class="text-slate-600">(leave blank for default: jct2025)</span></label>
          <input id="modal-password" type="text" class="input-field" placeholder="jct2025" autocomplete="off" />
        </div>
      </div>

      <div class="flex items-center justify-end gap-3 mt-6">
        <button class="btn btn-ghost btn-sm" onclick="document.getElementById('staff-modal').classList.add('hidden')">Cancel</button>
        <button id="modal-submit" class="btn btn-indigo btn-sm" onclick="submitModal()">Add Member</button>
      </div>
    </div>
  </div>

  <!-- Reset Password Modal -->
  <div id="pw-modal" class="modal-overlay hidden" onclick="closePwModal(event)">
    <div class="modal" onclick="event.stopPropagation()" style="max-width: 360px;">
      <h3 class="text-base font-semibold text-white mb-1">Reset Password</h3>
      <p class="text-sm text-slate-400 mb-5">Set a new password for <strong id="pw-target-name" class="text-white"></strong>.</p>
      <input id="pw-new" type="text" class="input-field mb-4" placeholder="New password (min 4 chars)" autocomplete="off" />
      <div class="flex items-center justify-end gap-3">
        <button class="btn btn-ghost btn-sm" onclick="document.getElementById('pw-modal').classList.add('hidden')">Cancel</button>
        <button class="btn btn-amber btn-sm" onclick="submitPasswordReset()">Reset Password</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <script>
    const COLORS = ['#6366f1','#10b981','#8b5cf6','#f59e0b','#ec4899','#f97316','#14b8a6','#f43f5e','#06b6d4','#a78bfa','#3b82f6','#84cc16'];
    let staffList = [];
    let editingId = null;
    let pwTargetId = null;
    let selectedColor = COLORS[0];

    // ── Init ──────────────────────────────────────────────────────────────────

    // ── Theme ──────────────────────────────────────────────────────────────────
    (function() {
      document.body.classList.toggle('dark', localStorage.getItem('jct-theme') === 'dark');
    })();

    async function init() {
      const res = await fetch('/api/me');
      if (res.status === 401 || res.redirected) { window.location.href = '/login.html'; return; }
      const me = await res.json();
      if (me.role !== 'admin') { window.location.href = '/hub.html'; return; }

      const av = document.getElementById('me-avatar');
      av.textContent = me.name.slice(0,2).toUpperCase();
      av.style.background = me.color + '22';
      av.style.color = me.color;
      document.getElementById('me-name').textContent = me.name;

      buildColorPicker();
      await loadStaff();
      setDefaultDate();
    }

    function setDefaultDate() {
      const d = new Date();
      const pad = n => String(n).padStart(2, '0');
      document.getElementById('clear-date').value = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    }

    function buildColorPicker() {
      const wrap = document.getElementById('color-picker');
      wrap.innerHTML = '';
      COLORS.forEach(c => {
        const div = document.createElement('div');
        div.className = 'color-swatch' + (c === selectedColor ? ' selected' : '');
        div.style.background = c;
        div.title = c;
        div.onclick = () => {
          selectedColor = c;
          document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
          div.classList.add('selected');
        };
        wrap.appendChild(div);
      });
    }

    // ── Load Staff ────────────────────────────────────────────────────────────

    async function loadStaff() {
      const res = await fetch('/api/admin/staff');
      if (!res.ok) { showToast('Failed to load staff', 'error'); return; }
      staffList = await res.json();
      renderStaff();
    }

    function renderStaff() {
      const list = document.getElementById('staff-list');
      document.getElementById('staff-count').textContent = `${staffList.length} member${staffList.length !== 1 ? 's' : ''}`;

      if (!staffList.length) {
        list.innerHTML = '<div class="px-6 py-8 text-center text-slate-500 text-sm">No staff members yet.</div>';
        return;
      }

      const sorted = [...staffList].sort((a, b) => {
        const order = { admin: 0, manager: 1, staff: 2 };
        return (order[a.role] ?? 3) - (order[b.role] ?? 3) || a.name.localeCompare(b.name);
      });

      list.innerHTML = sorted.map(s => `
        <div class="flex items-center gap-4 px-6 py-3.5">
          <div class="avatar" style="background:${s.color}22; color:${s.color}">${s.name.slice(0,2).toUpperCase()}</div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2">
              <span class="text-sm font-medium text-white">${s.name}</span>
              <span class="role-badge role-${s.role}">${s.role}</span>
            </div>
          </div>
          <div class="flex items-center gap-2 flex-shrink-0">
            <button class="btn btn-ghost btn-sm" onclick="openEditModal(${s.id})">Edit</button>
            <button class="btn btn-amber btn-sm" onclick="openPwModal(${s.id}, '${s.name}')">Password</button>
            <button class="btn btn-danger btn-sm" onclick="deleteStaff(${s.id}, '${s.name}')">Remove</button>
          </div>
        </div>
      `).join('');
    }

    // ── Add / Edit Modal ──────────────────────────────────────────────────────

    function openAddModal() {
      editingId = null;
      document.getElementById('modal-title').textContent  = 'Add Staff Member';
      document.getElementById('modal-submit').textContent = 'Add Member';
      document.getElementById('modal-name').value         = '';
      document.getElementById('modal-role').value         = 'staff';
      document.getElementById('modal-password').value     = '';
      document.getElementById('password-section').classList.remove('hidden');
      selectedColor = COLORS[0];
      buildColorPicker();
      document.getElementById('staff-modal').classList.remove('hidden');
      setTimeout(() => document.getElementById('modal-name').focus(), 50);
    }

    function openEditModal(id) {
      const s = staffList.find(m => m.id === id);
      if (!s) return;
      editingId = id;
      document.getElementById('modal-title').textContent  = `Edit — ${s.name}`;
      document.getElementById('modal-submit').textContent = 'Save Changes';
      document.getElementById('modal-name').value         = s.name;
      document.getElementById('modal-role').value         = s.role;
      document.getElementById('password-section').classList.add('hidden');
      selectedColor = s.color;
      buildColorPicker();
      document.getElementById('staff-modal').classList.remove('hidden');
      setTimeout(() => document.getElementById('modal-name').focus(), 50);
    }

    function closeModal(e) {
      if (e.target === document.getElementById('staff-modal')) {
        document.getElementById('staff-modal').classList.add('hidden');
      }
    }

    async function submitModal() {
      const name = document.getElementById('modal-name').value.trim();
      if (!name) { showToast('Name is required', 'error'); return; }

      if (editingId) {
        // Edit
        const res = await fetch(`/api/admin/staff/${editingId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, color: selectedColor, role: document.getElementById('modal-role').value }),
        });
        const data = await res.json();
        if (!res.ok) { showToast(data.error || 'Update failed', 'error'); return; }
        showToast(`${name} updated`);
      } else {
        // Add
        const password = document.getElementById('modal-password').value || 'jct2025';
        const res = await fetch('/api/admin/staff', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, color: selectedColor, role: document.getElementById('modal-role').value, password }),
        });
        const data = await res.json();
        if (!res.ok) { showToast(data.error || 'Add failed', 'error'); return; }
        showToast(`${name} added`);
      }

      document.getElementById('staff-modal').classList.add('hidden');
      await loadStaff();
    }

    // ── Password Reset Modal ──────────────────────────────────────────────────

    function openPwModal(id, name) {
      pwTargetId = id;
      document.getElementById('pw-target-name').textContent = name;
      document.getElementById('pw-new').value = '';
      document.getElementById('pw-modal').classList.remove('hidden');
      setTimeout(() => document.getElementById('pw-new').focus(), 50);
    }

    function closePwModal(e) {
      if (e.target === document.getElementById('pw-modal')) {
        document.getElementById('pw-modal').classList.add('hidden');
      }
    }

    async function submitPasswordReset() {
      const newPassword = document.getElementById('pw-new').value;
      if (!newPassword || newPassword.length < 4) { showToast('Password must be at least 4 characters', 'error'); return; }
      const res = await fetch(`/api/admin/staff/${pwTargetId}/reset-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ newPassword }),
      });
      const data = await res.json();
      if (!res.ok) { showToast(data.error || 'Reset failed', 'error'); return; }
      document.getElementById('pw-modal').classList.add('hidden');
      showToast('Password reset');
    }

    // ── Delete Staff ──────────────────────────────────────────────────────────

    async function deleteStaff(id, name) {
      if (!confirm(`Remove ${name} from the staff list? This cannot be undone.`)) return;
      const res = await fetch(`/api/admin/staff/${id}`, { method: 'DELETE' });
      const data = await res.json();
      if (!res.ok) { showToast(data.error || 'Delete failed', 'error'); return; }
      showToast(`${name} removed`);
      await loadStaff();
    }

    // ── Clear Day ─────────────────────────────────────────────────────────────

    async function clearDay() {
      const date = document.getElementById('clear-date').value;
      if (!date) { showToast('Select a date first', 'error'); return; }
      if (!confirm(`Delete all messages for ${date}? This cannot be undone.`)) return;
      const res = await fetch(`/api/messages/day/${date}`, { method: 'DELETE' });
      const data = await res.json();
      if (!res.ok) { showToast(data.error || 'Clear failed', 'error'); return; }
      showToast(`${data.deleted} message${data.deleted !== 1 ? 's' : ''} cleared`);
    }

    // ── Toast ─────────────────────────────────────────────────────────────────

    let toastTimer;
    function showToast(msg, type = 'success') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = `toast show ${type}`;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
    }

    // ── Keyboard shortcuts ────────────────────────────────────────────────────

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        document.getElementById('staff-modal').classList.add('hidden');
        document.getElementById('pw-modal').classList.add('hidden');
      }
      if (e.key === 'Enter' && !document.getElementById('staff-modal').classList.contains('hidden')) submitModal();
      if (e.key === 'Enter' && !document.getElementById('pw-modal').classList.contains('hidden')) submitPasswordReset();
    });

    init();
  </script>
  <script src="/chat-widget.js"></script>
</body>
</html>
