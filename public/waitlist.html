<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Waitlist · JCT Staff Hub</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --navy:#0c1738; --blue:#2c5c9c; --blue-soft:rgba(44,92,156,0.10);
      --canvas:#f7f9fc; --surface:#ffffff; --border:rgba(12,23,56,0.08);
      --text:#0c1738; --text-2:#4a6080; --text-3:#8fa0b8;
      --font-display:'Playfair Display',Georgia,serif; --font-body:'Inter',system-ui,sans-serif;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--canvas);color:var(--text);font-family:var(--font-body);font-size:15px;line-height:1.5;min-height:100vh;}

    .topstrip{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;flex-wrap:wrap;gap:10px;}
    .qnav{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:9px;text-decoration:none;color:var(--text-2);font-size:13px;font-weight:600;border:1px solid transparent;transition:all .15s;cursor:pointer;}
    .qnav svg{width:16px;height:16px;}
    .qnav:hover{background:#eef2f8;color:var(--text);}
    .qnav.qnav-active{background:var(--blue-soft);color:var(--blue);}
    @media(max-width:820px){.qnav span{display:none;}}
    .ts-right{display:flex;align-items:center;gap:10px;}
    .ts-user{display:flex;align-items:center;gap:8px;padding-left:8px;border-left:1px solid var(--border);}
    .av{width:28px;height:28px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;}
    .ts-signout{padding:6px 11px;background:transparent;border:1px solid var(--border);border-radius:8px;color:var(--text-3);font-family:var(--font-body);font-size:11px;font-weight:600;cursor:pointer;}
    .ts-signout:hover{color:#dc2626;border-color:rgba(220,38,38,0.3);}

    .main{max-width:900px;margin:0 auto;padding:26px 24px 90px;}
    h1{font-family:var(--font-display);font-size:1.7rem;font-weight:600;margin-bottom:3px;}
    .sub{font-size:13px;color:var(--text-2);margin-bottom:20px;max-width:640px;}

    .add-btn{display:inline-flex;align-items:center;gap:9px;background:var(--blue-soft);border:1.5px solid rgba(44,92,156,0.35);color:var(--blue);font-weight:600;font-size:15px;border-radius:13px;padding:12px 16px;cursor:pointer;transition:all .18s;box-shadow:0 1px 4px rgba(44,92,156,0.10);margin-bottom:18px;}
    .add-btn:hover{background:rgba(44,92,156,0.14);box-shadow:0 2px 10px rgba(44,92,156,0.18);}
    .add-btn svg{width:16px;height:16px;color:#fff;background:var(--blue);border-radius:50%;padding:4px;box-sizing:content-box;}

    .add-form{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:22px;display:none;}
    .add-form.open{display:block;}
    .af-grid{display:flex;flex-wrap:wrap;gap:12px;}
    .field{display:flex;flex-direction:column;gap:5px;}
    .field label{font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:0.04em;}
    .field input{font-family:var(--font-body);font-size:15px;padding:9px 12px;border:1px solid var(--border);border-radius:9px;background:#fff;color:var(--text);}
    .field input:focus{outline:none;border-color:var(--blue);}
    .af-actions{display:flex;gap:8px;margin-top:14px;justify-content:flex-end;}
    .btn{font-family:var(--font-body);font-weight:600;font-size:14px;border-radius:9px;padding:9px 16px;cursor:pointer;border:1px solid transparent;}
    .btn-primary{background:var(--blue);color:#fff;}
    .btn-primary:hover{background:#24507f;}
    .btn-ghost{background:transparent;border-color:var(--border);color:var(--text-2);}

    .section-label{font-size:12px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:0.05em;margin:22px 0 10px;}
    .empty{color:var(--text-3);font-size:14px;padding:24px;text-align:center;background:var(--surface);border:1px dashed var(--border);border-radius:14px;}

    .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px 18px;margin-bottom:12px;box-shadow:0 1px 3px rgba(12,23,56,0.04);}
    .card.filled{opacity:0.72;}
    .card-top{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;}
    .card-main{flex:1;min-width:0;}
    .card-program{font-size:16px;font-weight:700;color:var(--text);}
    .card-meta{font-size:13px;color:var(--text-2);margin-top:2px;}
    .card-meta .dot{color:var(--text-3);margin:0 6px;}
    .pill{font-size:11px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;padding:3px 10px;border-radius:100px;white-space:nowrap;}
    .pill-open{background:rgba(44,92,156,0.12);color:var(--blue);}
    .pill-working{background:rgba(217,119,6,0.14);color:#b45309;}
    .pill-filled{background:rgba(16,185,129,0.14);color:#0f7a43;}
    .card-note{font-size:14px;color:var(--text-2);background:var(--canvas);border-radius:9px;padding:9px 12px;margin-top:11px;}

    .seg{display:inline-flex;border:1px solid var(--border);border-radius:9px;overflow:hidden;margin-top:12px;}
    .seg button{font-family:var(--font-body);font-size:12.5px;font-weight:600;padding:6px 13px;background:#fff;border:none;border-right:1px solid var(--border);color:var(--text-2);cursor:pointer;transition:all .15s;}
    .seg button:last-child{border-right:none;}
    .seg button:hover{background:#eef2f8;}
    .seg button.on-open{background:var(--blue);color:#fff;}
    .seg button.on-working{background:#d97706;color:#fff;}
    .seg button.on-filled{background:#10b981;color:#fff;}

    .thread{margin-top:14px;border-top:1px solid var(--border);padding-top:12px;}
    .upd{display:flex;gap:9px;margin-bottom:9px;}
    .upd-av{width:26px;height:26px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:10px;overflow:hidden;}
    .upd-body{flex:1;min-width:0;}
    .upd-head{font-size:12.5px;}
    .upd-head .who{font-weight:700;}
    .upd-head .when{color:var(--text-3);margin-left:6px;font-size:11px;}
    .upd-text{font-size:14px;color:var(--text);}
    .upd-none{font-size:12.5px;color:var(--text-3);font-style:italic;margin-bottom:10px;}
    .upd-add{display:flex;gap:8px;margin-top:6px;}
    .upd-add input{flex:1;font-family:var(--font-body);font-size:14px;padding:8px 12px;border:1px solid var(--border);border-radius:9px;background:#fff;}
    .upd-add input:focus{outline:none;border-color:var(--blue);}
    .upd-add button{font-family:var(--font-body);font-weight:600;font-size:13px;padding:8px 14px;border-radius:9px;border:none;background:var(--blue-soft);color:var(--blue);cursor:pointer;}
    .upd-add button:hover{background:rgba(44,92,156,0.18);}
    .filled-by{font-size:12px;color:#0f7a43;font-weight:600;margin-top:10px;}
    .del-btn{background:transparent;border:none;color:var(--text-3);cursor:pointer;font-size:13px;padding:2px 6px;border-radius:6px;}
    .del-btn:hover{color:#dc2626;background:rgba(220,38,38,0.08);}
  </style>
</head>
<body>
  <div class="topstrip">
    <div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap">
      <a href="/hub.html" class="qnav" title="Dashboard"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.9"><rect x="3" y="3" width="7" height="7" rx="1.2"/><rect x="14" y="3" width="7" height="7" rx="1.2"/><rect x="3" y="14" width="7" height="7" rx="1.2"/><rect x="14" y="14" width="7" height="7" rx="1.2"/></svg><span>Dashboard</span></a>
      <a href="/checklist.html" class="qnav" title="Shift Checklist"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.9"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg><span>Checklist</span></a>
      <a href="/schedule.html" class="qnav" title="Schedule"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.9"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><span>Schedule</span></a>
      <span class="qnav qnav-active" title="Waitlist"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.9"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg><span>Waitlist</span></span>
      <a href="/comms.html" class="qnav" title="Communications"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.9"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>Comms</span></a>
    </div>
    <div class="ts-right">
      <div style="text-align:right"><div style="font-size:13px;font-weight:500" id="clock">—</div><div style="font-size:11px;color:var(--text-3)" id="dateline">—</div></div>
      <div class="ts-user"><div class="av" id="nav-avatar"></div><button class="ts-signout" onclick="doLogout()">Sign out</button></div>
    </div>
  </div>

  <main class="main">
    <h1>Waitlist — Open Spots</h1>
    <p class="sub">When a class cancellation opens a spot, log it here so the whole team can see it and fill it from the CampBrain waitlist. This is the shared record that replaces the printed sheet — nothing gets lost between shifts.</p>

    <button class="add-btn" id="add-btn" onclick="toggleAddForm()">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      Log an open spot
    </button>

    <div class="add-form" id="add-form">
      <div class="af-grid">
        <div class="field" style="flex:1;min-width:220px"><label>Class / program</label><input id="f-program" placeholder="e.g. Bronze (Rising Stars)"></div>
        <div class="field" style="flex:1;min-width:180px"><label>Day &amp; time</label><input id="f-daytime" placeholder="e.g. Tuesdays 4–5 PM"></div>
        <div class="field"><label>Opened</label><input type="date" id="f-opened"></div>
        <div class="field" style="width:90px"><label>Spots</label><input type="number" id="f-spots" value="1" min="1"></div>
        <div class="field" style="flex-basis:100%"><label>Note (optional)</label><input id="f-note" placeholder="Anything the next person should know"></div>
      </div>
      <div class="af-actions">
        <button class="btn btn-ghost" onclick="toggleAddForm()">Cancel</button>
        <button class="btn btn-primary" onclick="addSpot()">Add spot</button>
      </div>
    </div>

    <div id="board"></div>
  </main>

  <script src="/staff-avatar.js"></script>
  <script src="/live-sync.js"></script>
  <script>
    let me = null;

    function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
    function fmtDate(s){ if(!s) return ''; const d=new Date(s+'T00:00:00'); return d.toLocaleDateString('en-CA',{month:'short',day:'numeric'}); }
    function fmtWhen(iso){ const d=new Date(iso), t=new Date(); return d.toDateString()===t.toDateString() ? d.toLocaleTimeString('en-CA',{hour:'numeric',minute:'2-digit',hour12:true}) : d.toLocaleDateString('en-CA',{month:'short',day:'numeric'}); }

    function toggleAddForm(){
      const f=document.getElementById('add-form');
      f.classList.toggle('open');
      if(f.classList.contains('open')){
        if(!document.getElementById('f-opened').value) document.getElementById('f-opened').value=todayStr();
        document.getElementById('f-program').focus();
      }
    }

    async function addSpot(){
      const program=document.getElementById('f-program').value.trim();
      if(!program){ alert('Add the class / program first.'); return; }
      const body={
        program,
        day_time: document.getElementById('f-daytime').value.trim(),
        opened_date: document.getElementById('f-opened').value || todayStr(),
        spots: parseInt(document.getElementById('f-spots').value)||1,
        note: document.getElementById('f-note').value.trim(),
      };
      const res=await fetch('/api/waitlist',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      if(!res.ok){ alert('Could not save — try again.'); return; }
      document.getElementById('f-program').value='';
      document.getElementById('f-daytime').value='';
      document.getElementById('f-spots').value='1';
      document.getElementById('f-note').value='';
      toggleAddForm();
      load();
    }

    async function setStatus(id, status){
      await fetch(`/api/waitlist/${id}/status`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});
      load();
    }

    async function addUpdate(id){
      const inp=document.getElementById(`upd-${id}`);
      const content=inp.value.trim();
      if(!content) return;
      await fetch(`/api/waitlist/${id}/update`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content})});
      inp.value='';
      load();
    }
    function updKey(e,id){ if(e.key==='Enter'){ e.preventDefault(); addUpdate(id); } }

    async function delSpot(id){
      if(!confirm('Remove this spot? This deletes it for everyone.')) return;
      await fetch(`/api/waitlist/${id}`,{method:'DELETE'});
      load();
    }

    function card(s){
      const updates=(s.updates||[]).map(u=>`
        <div class="upd">
          <div class="upd-av" data-av="${u.author_id}" data-name="${esc(u.author_name||'?')}" data-color="${u.author_color||'#4a6080'}" style="background:${(u.author_color||'#4a6080')}22;color:${u.author_color||'#4a6080'}">${esc((u.author_name||'?').slice(0,2).toUpperCase())}</div>
          <div class="upd-body"><div class="upd-head"><span class="who">${esc(u.author_name||'Someone')}</span><span class="when">${fmtWhen(u.created_at)}</span></div><div class="upd-text">${esc(u.content)}</div></div>
        </div>`).join('');
      const meta=[ s.day_time?esc(s.day_time):'', s.spots>1?`${s.spots} spots`:'1 spot', s.opened_date?`opened ${fmtDate(s.opened_date)}`:'' ]
        .filter(Boolean).join('<span class="dot">·</span>');
      const canDelete = me && me.is_management;
      return `
      <div class="card ${s.status==='filled'?'filled':''}">
        <div class="card-top">
          <div class="card-main">
            <div class="card-program">${esc(s.program)}</div>
            <div class="card-meta">${meta}</div>
          </div>
          <span class="pill pill-${s.status}">${s.status}</span>
          ${canDelete?`<button class="del-btn" title="Remove spot" onclick="delSpot(${s.id})">✕</button>`:''}
        </div>
        ${s.note?`<div class="card-note">${esc(s.note)}</div>`:''}
        <div class="seg">
          <button class="${s.status==='open'?'on-open':''}" onclick="setStatus(${s.id},'open')">Open</button>
          <button class="${s.status==='working'?'on-working':''}" onclick="setStatus(${s.id},'working')">Working</button>
          <button class="${s.status==='filled'?'on-filled':''}" onclick="setStatus(${s.id},'filled')">Filled</button>
        </div>
        ${s.status==='filled'&&s.filled_by_name?`<div class="filled-by">✓ Filled by ${esc(s.filled_by_name)}</div>`:''}
        <div class="thread">
          ${updates || '<div class="upd-none">No updates yet — add the first note when you start working this spot.</div>'}
          <div class="upd-add">
            <input id="upd-${s.id}" placeholder="Add an update…" onkeydown="updKey(event,${s.id})">
            <button onclick="addUpdate(${s.id})">Post</button>
          </div>
        </div>
      </div>`;
    }

    function render(spots){
      const active=spots.filter(s=>s.status!=='filled');
      const filled=spots.filter(s=>s.status==='filled');
      let html='';
      html+=`<div class="section-label">Open (${active.length})</div>`;
      html+= active.length ? active.map(card).join('') : '<div class="empty">No open spots right now. When a cancellation comes in, log it above.</div>';
      if(filled.length){
        html+=`<div class="section-label">Filled — last 14 days (${filled.length})</div>`;
        html+= filled.map(card).join('');
      }
      const board=document.getElementById('board');
      board.innerHTML=html;
      board.querySelectorAll('[data-av]').forEach(el=>{ try{ staffAvatar(el,el.dataset.av,el.dataset.name,el.dataset.color); }catch(e){} });
    }

    async function load(){
      const res=await fetch('/api/waitlist');
      if(res.status===401){ window.location.href='/login.html'; return; }
      const spots=await res.json();
      render(spots);
    }
    window.onLiveUpdate = load;   // refresh instantly when any teammate changes a spot

    function updateClock(){
      const d=new Date();
      const c=document.getElementById('clock'), dl=document.getElementById('dateline');
      if(c) c.textContent=d.toLocaleTimeString('en-CA',{hour:'numeric',minute:'2-digit',hour12:true});
      if(dl) dl.textContent=d.toLocaleDateString('en-CA',{weekday:'short',month:'short',day:'numeric'});
    }
    async function doLogout(){ await fetch('/api/auth/logout',{method:'POST'}); window.location.href='/login.html'; }

    async function init(){
      const res=await fetch('/api/me');
      if(res.status===401){ window.location.href='/login.html'; return; }
      me=await res.json();
      const av=document.getElementById('nav-avatar'); if(av){ try{ staffAvatar(av,me.id,me.name,me.color); }catch(e){} }
      updateClock(); setInterval(updateClock,30000);
      document.getElementById('f-opened').value=todayStr();
      load();
    }
    init();
  </script>
</body>
</html>
