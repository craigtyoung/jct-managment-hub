<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pro Schedule · JCT</title>
  <link rel="icon" href="/jct-logo.png" />
  <style>
    :root {
      --bg:#f4f6fa; --surface:#ffffff; --border:#e4e8f0; --border2:#d4dae6;
      --text:#0c1738; --text2:#3b4a63; --text3:#8a97ad; --input-bg:#f8fafc;
      --navy:#0c1738; --blue:#2c5c9c; --blue-soft:rgba(44,92,156,0.10);
      --green:#16a34a; --amber:#d97706;
      --font-body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:var(--font-body); background:var(--bg); color:var(--text); padding:0 0 60px; }
    .topbar { display:flex; align-items:center; gap:12px; padding:14px 20px; background:var(--surface); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:10; }
    .topbar img { height:30px; }
    .topbar h1 { font-size:17px; font-weight:800; letter-spacing:-0.01em; }
    .topbar .crumb { margin-left:auto; display:flex; gap:8px; align-items:center; font-size:13px; }
    .topbar a { color:var(--blue); text-decoration:none; font-weight:600; }
    .wrap { max-width:1100px; margin:0 auto; padding:18px 20px; }
    .lead { color:var(--text2); font-size:13px; margin-bottom:14px; }
    .lead b { color:var(--text); }
    .roview { background:rgba(217,119,6,0.10); border:1px solid rgba(217,119,6,0.30); color:var(--amber); font-weight:700; font-size:12px; padding:7px 12px; border-radius:10px; margin-bottom:14px; display:none; }

    .daytabs { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px; }
    .daytab { padding:8px 16px; border:1px solid var(--border2); background:var(--surface); border-radius:100px; font-size:13px; font-weight:700; color:var(--text2); cursor:pointer; font-family:inherit; }
    .daytab.on { background:var(--navy); color:#fff; border-color:var(--navy); }
    .daytab .n { color:var(--text3); font-weight:600; margin-left:5px; }
    .daytab.on .n { color:#cbd5e1; }

    .slot { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:13px 15px; margin-bottom:10px; box-shadow:0 1px 3px rgba(12,23,56,0.04); }
    .slot-top { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .slot-time { font-size:14px; font-weight:800; color:var(--blue); background:var(--blue-soft); border-radius:8px; padding:4px 10px; white-space:nowrap; }
    .slot-prog { font-size:15px; font-weight:700; }
    .cat { font-size:10px; font-weight:800; letter-spacing:0.05em; text-transform:uppercase; padding:3px 8px; border-radius:100px; }
    .cat-junior { background:rgba(44,92,156,0.12); color:var(--blue); }
    .cat-adult { background:rgba(22,163,74,0.12); color:var(--green); }
    .cat-other { background:rgba(148,163,184,0.15); color:#64748b; }
    .slot-meta { margin-left:auto; display:flex; gap:8px; align-items:center; }
    .field { display:flex; align-items:center; gap:5px; font-size:12px; color:var(--text3); }
    .field select, .field input { font-family:inherit; font-size:12px; padding:4px 7px; border:1px solid var(--border2); border-radius:8px; background:var(--input-bg); color:var(--text); }
    .field input { width:64px; }

    .pros-row { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:11px; padding-top:11px; border-top:1px dashed var(--border); }
    .pros-label { font-size:11px; font-weight:700; color:var(--text3); text-transform:uppercase; letter-spacing:0.05em; }
    .pchip { display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:700; padding:4px 9px; border-radius:100px; color:#fff; }
    .pchip button { background:rgba(255,255,255,0.35); border:none; color:#fff; width:15px; height:15px; border-radius:50%; cursor:pointer; font-size:11px; line-height:1; display:flex; align-items:center; justify-content:center; }
    .pchip.ro button { display:none; }
    .paddsel { font-family:inherit; font-size:12px; padding:4px 8px; border:1px dashed var(--border2); border-radius:100px; background:var(--input-bg); color:var(--blue); font-weight:700; cursor:pointer; }
    .noone { font-size:12px; color:var(--text3); font-style:italic; }

    .addbtn { margin-top:8px; padding:9px 16px; border:1px dashed var(--border2); background:var(--surface); border-radius:10px; font-weight:700; font-size:13px; color:var(--blue); cursor:pointer; font-family:inherit; width:100%; }
    .empty { padding:40px; text-align:center; color:var(--text3); }
    .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(80px); background:var(--navy); color:#fff; padding:10px 18px; border-radius:10px; font-size:13px; font-weight:600; opacity:0; transition:all .25s; z-index:50; }
    .toast.show { transform:translateX(-50%) translateY(0); opacity:1; }

    /* View toggle */
    .viewtoggle { display:inline-flex; gap:0; border:1px solid var(--border2); border-radius:100px; overflow:hidden; margin-bottom:14px; }
    .vtbtn { padding:7px 16px; border:none; background:var(--surface); font-family:inherit; font-size:13px; font-weight:700; color:var(--text2); cursor:pointer; }
    .vtbtn.on { background:var(--navy); color:#fff; }

    /* Multi-court picker */
    .courts-pick { display:inline-flex; gap:4px; }
    .courtchip { width:26px; height:26px; border-radius:7px; border:1px solid var(--border2); background:var(--input-bg); color:var(--text3); font-weight:800; font-size:12px; cursor:pointer; font-family:inherit; }
    .courtchip.on { background:var(--blue); color:#fff; border-color:var(--blue); }
    .courts-label { font-size:11px; color:var(--text3); font-weight:700; margin-right:2px; }

    /* Court × Time board */
    .ctwrap { overflow-x:auto; border:1px solid var(--border); border-radius:14px; background:var(--surface); }
    table.ct { border-collapse:collapse; width:100%; min-width:720px; }
    table.ct th, table.ct td { border:1px solid var(--border); padding:6px; vertical-align:top; text-align:left; }
    table.ct thead th { background:var(--navy); color:#fff; font-size:12px; font-weight:700; position:sticky; top:0; }
    table.ct th.ct-time, table.ct td.ct-time { background:var(--input-bg); font-size:12px; font-weight:800; color:var(--blue); white-space:nowrap; width:110px; }
    .ctcell { border-radius:8px; padding:6px 8px; margin-bottom:5px; border-left:3px solid var(--border2); background:var(--input-bg); }
    .ctcell.cat-j { border-left-color:var(--blue); }
    .ctcell.cat-a { border-left-color:var(--green); }
    .ctcell.cat-o { border-left-color:#94a3b8; }
    .ctprog { font-size:12px; font-weight:700; margin-bottom:3px; }
    .ctpros { display:flex; flex-wrap:wrap; gap:3px; }
    .ctp { font-size:10px; font-weight:700; color:#fff; padding:2px 6px; border-radius:100px; }
    .ctnone { font-size:11px; color:var(--text3); font-style:italic; }
    .unassigned { margin-top:12px; padding:10px 14px; border:1px dashed var(--border2); border-radius:10px; font-size:12px; color:var(--text2); background:var(--surface); }
    @media (max-width:640px){ .slot-meta{ margin-left:0; width:100%; } }

    /* Platform chrome — matches the other pages (topstrip + qnav) */
    .topstrip { background:var(--surface); border-bottom:1px solid var(--border); padding:11px 20px; display:flex; align-items:center; justify-content:space-between; gap:12px; position:sticky; top:0; z-index:100; flex-wrap:wrap; }
    .qnav-row { display:flex; align-items:center; gap:4px; flex-wrap:wrap; }
    .qnav { display:inline-flex; align-items:center; gap:6px; padding:6px 11px; border-radius:9px; text-decoration:none; color:var(--text2); font-size:13px; font-weight:600; border:1px solid transparent; transition:all .15s; cursor:pointer; background:none; font-family:inherit; }
    .qnav svg { width:16px; height:16px; }
    .qnav:hover { background:#eef2f8; color:var(--text); }
    .qnav.qnav-active { background:rgba(44,92,156,0.10); color:var(--blue); }
    @media (max-width:860px){ .qnav span { display:none; } }
    .ts-right { display:flex; align-items:center; gap:10px; }
    .ts-clock { font-size:13px; font-weight:500; color:var(--text); line-height:1; }
    .ts-date { font-size:11px; color:var(--text3); margin-top:2px; }
    .ts-user { display:flex; align-items:center; gap:8px; padding-left:8px; border-left:1px solid var(--border); }
    .ts-avatar { width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:11px; color:#fff; background:var(--navy); }
    .ts-signout { padding:6px 11px; background:transparent; border:1px solid var(--border); border-radius:8px; color:var(--text3); font-family:inherit; font-size:11px; font-weight:600; cursor:pointer; }
    .ts-signout:hover { color:#dc2626; border-color:rgba(220,38,38,0.3); }

    /* Day side-nav + board layout */
    .sched-cols { display:flex; gap:18px; align-items:flex-start; }
    .day-rail { flex:0 0 150px; display:flex; flex-direction:column; gap:5px; position:sticky; top:70px; }
    .sched-body { flex:1; min-width:0; }
    .daytab { display:flex; align-items:center; justify-content:space-between; padding:9px 14px; border:1px solid var(--border2); background:var(--surface); border-radius:10px; font-size:13px; font-weight:700; color:var(--text2); cursor:pointer; font-family:inherit; width:100%; text-align:left; }
    .daytab.on { background:var(--navy); color:#fff; border-color:var(--navy); }
    .daytab .n { color:var(--text3); font-weight:600; }
    .daytab.on .n { color:#cbd5e1; }
    @media (max-width:720px){ .sched-cols { flex-direction:column; } .day-rail { flex-direction:row; flex-wrap:wrap; position:static; flex-basis:auto; width:100%; } .daytab { width:auto; } }

    /* Drag-and-drop assignment */
    .prorail { position:sticky; top:58px; z-index:20; display:flex; flex-wrap:wrap; gap:6px; align-items:center; padding:10px 12px; margin-bottom:12px; background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:0 1px 3px rgba(12,23,56,0.05); }
    .pr-label { font-size:11px; font-weight:700; color:var(--text3); text-transform:uppercase; letter-spacing:0.05em; margin-right:2px; }
    .prochip { display:inline-flex; align-items:center; font-size:12px; font-weight:700; padding:5px 11px; border-radius:100px; color:#fff; cursor:grab; user-select:none; }
    .prochip:active { cursor:grabbing; }
    .prochip.dragging { opacity:0.4; }
    .courtzones { display:flex; flex-wrap:wrap; gap:8px; margin-top:11px; padding-top:11px; border-top:1px dashed var(--border); }
    .courtdrop { min-width:104px; border:1.5px dashed var(--border2); border-radius:10px; padding:7px 9px; background:var(--input-bg); transition:all .12s; }
    .courtdrop.drop-hot { border-color:var(--blue); background:rgba(44,92,156,0.10); }
    .cd-label { font-size:10px; font-weight:800; letter-spacing:0.04em; color:var(--text3); text-transform:uppercase; margin-bottom:5px; }
    .cd-pros { display:flex; flex-wrap:wrap; gap:4px; align-items:center; }
    .cd-empty { font-size:11px; color:var(--text3); font-style:italic; }
    .cdchip { display:inline-flex; align-items:center; gap:4px; font-size:12px; font-weight:700; padding:3px 8px; border-radius:100px; color:#fff; cursor:grab; }
    .cdchip button, .ctp button { background:rgba(255,255,255,0.4); border:none; color:#fff; width:14px; height:14px; border-radius:50%; cursor:pointer; font-size:9px; line-height:1; display:inline-flex; align-items:center; justify-content:center; margin-left:1px; }
    .cd-add { font-family:inherit; font-size:11px; padding:2px 7px; border:1px dashed var(--border2); border-radius:100px; background:transparent; color:var(--blue); font-weight:700; cursor:pointer; }
    .ctcell.dz { cursor:default; }
    .ctcell.drop-hot { outline:2px solid var(--blue); outline-offset:-2px; background:rgba(44,92,156,0.10); }

    /* Days on top (horizontal), pros down the left (vertical) */
    .daytop { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
    .daytop .daytab { width:auto; }
    .prorail-left { flex-direction:column !important; align-items:stretch; gap:9px; flex:0 0 156px; width:156px; position:sticky; top:64px; max-height:calc(100vh - 90px); overflow-y:auto; margin-bottom:0 !important; padding:12px; }
    .prorail-left .pr-label { margin:0 0 3px; }
    .prorail-left .prochip { justify-content:flex-start; }
    @media (max-width:720px){
      .prorail-left { flex-direction:row !important; flex-wrap:wrap; position:static; width:100%; flex:0 0 auto; max-height:none; margin-bottom:12px !important; }
    }
  </style>
</head>
<body>
  <div class="topstrip">
    <div class="qnav-row">
      <a href="/hub.html" class="qnav" title="Dashboard"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.9"><rect x="3" y="3" width="7" height="7" rx="1.2"/><rect x="14" y="3" width="7" height="7" rx="1.2"/><rect x="3" y="14" width="7" height="7" rx="1.2"/><rect x="14" y="14" width="7" height="7" rx="1.2"/></svg><span>Dashboard</span></a>
      <a href="/schedule.html" class="qnav" title="Shift Schedule"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.9"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><span>Shifts</span></a>
      <span class="qnav qnav-active" title="Pro Schedule"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.9"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg><span>Pro Schedule</span></span>
      <a href="/timesheet.html" class="qnav" title="Timesheets"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span>Time</span></a>
      <a href="/comms.html?audience=pro" class="qnav" title="Pro Comms"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.9"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>Pro Comms</span></a>
    </div>
    <div class="ts-right">
      <div style="text-align:right"><div class="ts-clock" id="clock">—</div><div class="ts-date" id="dateline">—</div></div>
      <div class="ts-user"><div class="ts-avatar" id="nav-avatar">—</div><button class="ts-signout" onclick="doLogout()">Sign out</button></div>
    </div>
  </div>

  <div class="wrap">
    <div class="lead">The season class grid. <b>Assign a court and the pros</b> for each class — set once, tweak anytime. Pros see the board read-only.</div>
    <div id="roview" class="roview">👀 View only — management sets the schedule.</div>
    <div id="daytabs" class="daytop"></div>
    <div class="sched-cols">
      <aside id="prorail" class="prorail prorail-left" style="display:none"></aside>
      <div class="sched-body">
        <div class="viewtoggle">
          <button id="vt-list" class="vtbtn on" onclick="setView('list')">By class</button>
          <button id="vt-grid" class="vtbtn" onclick="setView('grid')">Court × Time</button>
        </div>
        <div id="board"><div class="empty">Loading…</div></div>
        <button id="addbtn" class="addbtn" style="display:none" onclick="addSlot()">+ Add a slot (performance, house league, etc.)</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
    const DAY_FULL = { Mon:'Monday', Tue:'Tuesday', Wed:'Wednesday', Thu:'Thursday', Fri:'Friday', Sat:'Saturday', Sun:'Sunday' };
    let me = null, canEdit = false, pros = [], slots = [], activeDay = 'Mon', view = 'list';

    function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2000); }
    function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function proById(id){ return pros.find(p=>p.id===id); }
    function catClass(c){ return c==='junior'?'cat-junior':c==='adult'?'cat-adult':'cat-other'; }
    async function doLogout(){ try{ await fetch('/api/auth/logout',{method:'POST'}); }catch(e){} location.href='/login.html'; }
    function tick(){ const n=new Date(); const c=document.getElementById('clock'), d=document.getElementById('dateline'); if(c) c.textContent=n.toLocaleTimeString('en-CA',{hour:'2-digit',minute:'2-digit',hour12:true}); if(d) d.textContent=n.toLocaleDateString('en-CA',{weekday:'short',month:'short',day:'numeric'}); }
    tick(); setInterval(tick, 30000);

    async function init(){
      try {
        const meRes = await fetch('/api/me');
        if (!meRes.ok) { location.href='/login.html'; return; }
        me = await meRes.json();
      } catch(e){ location.href='/login.html'; return; }
      const av=document.getElementById('nav-avatar'); if(av){ av.textContent=(me.name||'?').slice(0,2).toUpperCase(); if(me.color) av.style.background=me.color; }
      canEdit = me.role==='admin' || me.role==='manager';
      if (!canEdit) document.getElementById('roview').style.display='block';
      if (canEdit) document.getElementById('addbtn').style.display='block';
      // default to today if it's a weekday we have
      const jsDay = new Date().getDay(); // 0=Sun..6=Sat
      activeDay = DAYS[(jsDay+6)%7] || 'Mon';
      try { pros = await (await fetch('/api/pro-schedule/pros')).json(); } catch(e){ pros=[]; }
      renderProRail();
      await loadSlots();
      renderTabs();
    }

    function renderProRail(){
      const rail=document.getElementById('prorail');
      if(!rail) return;
      if(!canEdit){ rail.style.display='none'; return; }
      rail.style.display='flex';
      rail.innerHTML='<span class="pr-label">Pros — drag onto a court</span>'+
        pros.map(p=>`<span class="prochip" draggable="true" ondragstart="dragPro(event,${p.id})" ondragend="dragEnd(event)" style="background:${p.color||'#2c5c9c'}">${esc(p.name)}</span>`).join('');
    }

    // ── Drag-and-drop ──
    let dragProId=null;
    function dragPro(e,id){ dragProId=id; try{ e.dataTransfer.setData('text/plain',String(id)); e.dataTransfer.effectAllowed='copy'; }catch(_){ } if(e.currentTarget.classList) e.currentTarget.classList.add('dragging'); }
    function dragEnd(e){ if(e.currentTarget.classList) e.currentTarget.classList.remove('dragging'); dragProId=null; }
    function dzOver(e){ e.preventDefault(); try{ e.dataTransfer.dropEffect='copy'; }catch(_){ } e.currentTarget.classList.add('drop-hot'); }
    function dzLeave(e){ e.currentTarget.classList.remove('drop-hot'); }
    function dzDrop(e){ e.preventDefault(); const el=e.currentTarget; el.classList.remove('drop-hot'); let id=dragProId; try{ id=parseInt(e.dataTransfer.getData('text/plain'))||dragProId; }catch(_){ } if(!id) return; assignToCourt(parseInt(el.dataset.slot), el.dataset.court, id); }

    async function loadSlots(){
      try { slots = await (await fetch('/api/pro-schedule/slots')).json(); }
      catch(e){ slots=[]; }
      renderBoard();
    }

    function renderTabs(){
      const wrap=document.getElementById('daytabs');
      wrap.innerHTML = DAYS.map(d=>{
        const n = slots.filter(s=>s.day===d).length;
        return `<button class="daytab ${d===activeDay?'on':''}" onclick="setDay('${d}')">${DAY_FULL[d]}<span class="n">${n}</span></button>`;
      }).join('');
    }
    function setDay(d){ activeDay=d; renderTabs(); renderBoard(); }

    function renderBoard(){ if(view==='grid') renderCourtTimeBoard(); else renderListBoard(); }
    function setView(v){ view=v; document.getElementById('vt-list').classList.toggle('on',v==='list'); document.getElementById('vt-grid').classList.toggle('on',v==='grid'); renderBoard(); }
    function renderListBoard(){
      const board=document.getElementById('board');
      const list = slots.filter(s=>s.day===activeDay);
      if (!list.length){ board.innerHTML='<div class="empty">No classes for '+DAY_FULL[activeDay]+' yet.</div>'; return; }
      board.innerHTML = list.map(renderSlot).join('');
    }
    function renderCourtTimeBoard(){
      const board=document.getElementById('board');
      const list = slots.filter(s=>s.day===activeDay);
      if(!list.length){ board.innerHTML='<div class="empty">No classes for '+DAY_FULL[activeDay]+' yet.</div>'; return; }
      const COURTS=['1','2','3','4','5','6'];
      const key=s=>s.start+'-'+s.end;
      const times=[...new Map(list.map(s=>[key(s),{start:s.start,end:s.end,label:s.time_label||(s.start+'–'+s.end)}])).values()].sort((a,b)=>a.start.localeCompare(b.start));
      const catAbbr=c=>c==='junior'?'j':c==='adult'?'a':'o';
      let html='<div class="ctwrap"><table class="ct"><thead><tr><th class="ct-time">Time</th>'+COURTS.map(c=>`<th>Court ${c}</th>`).join('')+'</tr></thead><tbody>';
      for(const t of times){
        html+=`<tr><td class="ct-time">${esc(t.label)}</td>`;
        for(const c of COURTS){
          const cells=list.filter(s=>key(s)===t.start+'-'+t.end && (s.courts||[]).includes(c));
          html+='<td>'+cells.map(s=>{
            const ids=(s.court_pros&&s.court_pros[c])||[];
            const chips=ids.map(id=>{const p=proById(id);return p?`<span class="ctp" style="background:${p.color||'#2c5c9c'}" ${canEdit?`draggable="true" ondragstart="dragPro(event,${id})" ondragend="dragEnd(event)"`:''}>${esc(String(p.name).split(' ')[0])}${canEdit?`<button onclick="unassignFromCourt(${s.id},'${c}',${id})" title="Remove">✕</button>`:''}</span>`:''}).join('')||'<span class="ctnone">—</span>';
            return `<div class="ctcell cat-${catAbbr(s.category)}${canEdit?' dz':''}" data-slot="${s.id}" data-court="${c}" ${canEdit?'ondragover="dzOver(event)" ondragleave="dzLeave(event)" ondrop="dzDrop(event)"':''}><div class="ctprog">${esc(s.program)}</div><div class="ctpros">${chips}</div></div>`;
          }).join('')+'</td>';
        }
        html+='</tr>';
      }
      html+='</tbody></table></div>';
      const noCourt=list.filter(s=>!(s.courts&&s.courts.length));
      if(noCourt.length){ html+='<div class="unassigned"><b>No court assigned yet:</b> '+noCourt.map(s=>esc(s.program)+' <span style="color:var(--text3)">('+esc(s.time_label||s.start)+')</span>').join(' · ')+'</div>'; }
      board.innerHTML=html;
    }

    function renderSlot(s){
      const courts = s.courts || [];
      const cp = s.court_pros || {};
      const courtPick = ['1','2','3','4','5','6'].map(c=>`<button class="courtchip ${courts.includes(c)?'on':''}" onclick="toggleCourt(${s.id},'${c}')">${c}</button>`).join('');
      const meta = canEdit
        ? `<div class="slot-meta"><span class="courts-label">Courts</span><span class="courts-pick">${courtPick}</span>
             <button class="cd-add" style="border-style:solid;color:#dc2626;margin-left:6px" onclick="removeSlot(${s.id})" title="Remove slot">🗑</button></div>`
        : `<div class="slot-meta">${courts.length?('Court '+courts.join(', ')):'<span class="noone">No court</span>'}</div>`;
      let zones;
      if (courts.length) {
        zones = courts.map(c=>{
          const ids = cp[c] || [];
          const chips = ids.map(id=>{ const p=proById(id); return p?`<span class="cdchip" style="background:${p.color||'#2c5c9c'}" ${canEdit?`draggable="true" ondragstart="dragPro(event,${id})" ondragend="dragEnd(event)"`:''}>${esc(p.name)}${canEdit?`<button onclick="unassignFromCourt(${s.id},'${c}',${id})" title="Remove">✕</button>`:''}</span>`:''; }).join('');
          const add = canEdit ? `<select class="cd-add" onchange="if(this.value){assignToCourt(${s.id},'${c}',parseInt(this.value));this.value='';}"><option value="">+</option>${pros.filter(p=>!ids.includes(p.id)).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>` : '';
          return `<div class="courtdrop" data-slot="${s.id}" data-court="${c}" ${canEdit?'ondragover="dzOver(event)" ondragleave="dzLeave(event)" ondrop="dzDrop(event)"':''}>
            <div class="cd-label">Court ${c}</div>
            <div class="cd-pros">${chips || `<span class="cd-empty">${canEdit?'drop a pro':'—'}</span>`}${add}</div>
          </div>`;
        }).join('');
      } else {
        zones = `<span class="noone">${canEdit?'Pick a court above, then drag pros in':'No court assigned'}</span>`;
      }
      return `<div class="slot">
        <div class="slot-top">
          <span class="slot-time">${esc(s.time_label || (s.start+'–'+s.end))}</span>
          <span class="slot-prog">${esc(s.program)}</span>
          <span class="cat ${catClass(s.category)}">${esc(s.category||'')}</span>
          ${s.note?`<span class="field" title="note">· ${esc(s.note)}</span>`:''}
          ${meta}
        </div>
        <div class="courtzones">${zones}</div>
      </div>`;
    }

    async function put(id, body){
      const r = await fetch('/api/pro-schedule/slots/'+id, { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
      if (!r.ok){ toast('Save failed'); return null; }
      const updated = await r.json();
      const i = slots.findIndex(s=>s.id===id); if (i>=0) slots[i]=updated;
      return updated;
    }
    async function assignToCourt(slotId, court, proId){
      if(!proId) return;
      const s=slots.find(x=>x.id===slotId); if(!s) return;
      const cp=JSON.parse(JSON.stringify(s.court_pros||{}));
      cp[court]=cp[court]||[]; if(!cp[court].includes(proId)) cp[court].push(proId);
      const courts=[...new Set([...(s.courts||[]), court])].sort();
      if(await put(slotId,{court_pros:cp, courts})){ renderBoard(); toast('Assigned'); }
    }
    async function unassignFromCourt(slotId, court, proId){
      const s=slots.find(x=>x.id===slotId); if(!s) return;
      const cp=JSON.parse(JSON.stringify(s.court_pros||{}));
      cp[court]=(cp[court]||[]).filter(x=>x!==proId);
      if(await put(slotId,{court_pros:cp})){ renderBoard(); }
    }
    async function setField(id, field, val){ if(await put(id,{[field]:val})){ toast('Saved'); } }
    async function toggleCourt(id, c){
      const s=slots.find(x=>x.id===id); const cur=(s.courts||[]);
      const removing=cur.includes(c);
      const courts= removing ? cur.filter(x=>x!==c) : [...cur,c].sort();
      const body={courts};
      if(removing){ const cp=JSON.parse(JSON.stringify(s.court_pros||{})); delete cp[c]; body.court_pros=cp; }
      if(await put(id,body)){ renderBoard(); }
    }

    async function addSlot(){
      const body = { day:activeDay, program:'New slot', category:'other', start:'09:00', end:'10:00', time_label:'9–10 AM' };
      const r = await fetch('/api/pro-schedule/slots', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
      if (!r.ok){ toast('Add failed'); return; }
      await loadSlots(); renderTabs(); toast('Slot added — edit it below');
    }
    async function removeSlot(id){
      const r = await fetch('/api/pro-schedule/slots/'+id, { method:'DELETE' });
      if (!r.ok){ toast('Remove failed'); return; }
      slots = slots.filter(s=>s.id!==id); renderTabs(); renderBoard(); toast('Slot removed');
    }

    init();
  </script>
</body>
</html>
